name: CryptoBot AI — Phase 2D Prospective Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: cryptobot-phase2d
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow fastparquet

      - name: Restore previous Phase 2D state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p research_outputs

          RUN_ID=$(gh run list \
            --workflow="run_phase2d.yml" \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId' \
            | head -n 1 || true)

          if [ -n "$RUN_ID" ]; then
            echo "Restoring Phase 2D state from run $RUN_ID"
            gh run download "$RUN_ID" \
              -n phase2d-state \
              -D research_outputs || true
          else
            echo "No previous Phase 2D state found. Starting fresh."
          fi

      - name: Download locked HTF-removal candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh run download 35139155066 \
            -n htf-removal-candidate \
            -D phase2d_candidate

          cp phase2d_candidate/candidate_model.pkl ./candidate_model.pkl
          test -s candidate_model.pkl

      - name: Verify locked candidate
        run: |
          set -e

          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = (
              "45064fddd32f2e23eb4c34ed56bcbe73a8a1bffc"
              "90b8b9b6d82fc3838c4308c2"
          )

          actual = hashlib.sha256(
              Path("candidate_model.pkl").read_bytes()
          ).hexdigest()

          print("candidate SHA256:", actual)

          if actual != expected:
              raise SystemExit(
                  "FATAL: candidate SHA does not match locked HTF-removal candidate"
              )
          PY

      - name: Download locked production model v2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh release download v2.0 \
            --repo "${{ github.repository }}" \
            --pattern 'pro_crypto_ai_model.pkl' \
            --dir . \
            --clobber

          test -s pro_crypto_ai_model.pkl
          ls -lh pro_crypto_ai_model.pkl

            - name: Verify production model
        run: |
          set -e

          python - <<'PY'
          import hashlib
          import joblib
          from pathlib import Path

          expected = (
              "f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"
          )

          path = Path("pro_crypto_ai_model.pkl")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()

          print("production SHA256:", actual)

          if actual != expected:
              raise SystemExit(
                  "FATAL: production SHA does not match locked v2.0 model"
              )

          model = joblib.load(path)

          if not isinstance(model, dict):
              raise SystemExit(
                  "FATAL: unexpected production model type"
              )

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }

          missing = required - set(model)

          if missing:
              raise SystemExit(
                  f"FATAL: production model missing keys: {sorted(missing)}"
              )

          declared = [
              str(x)
              for x in model["all_features"]
          ]

          selected = [
              str(x)
              for x in model["best_features"]
          ]

          print(
              "production declared features:",
              len(declared),
          )

          print(
              "production selected features:",
              len(selected),
          )

          print(
              "production trained_at:",
              model.get("trained_at"),
          )

          print(
              "production selected feature list:",
              selected,
          )

          if len(declared) != 63:
              raise SystemExit(
                  "FATAL: expected 63 production declared features"
              )

          if len(selected) != 35:
              raise SystemExit(
                  "FATAL: expected 35 production selected features"
              )

          missing_from_declared = [
              f for f in selected
              if f not in declared
          ]

          if missing_from_declared:
              raise SystemExit(
                  "FATAL: best_features contains features "
                  f"not present in all_features: "
                  f"{missing_from_declared}"
              )
          PY

      - name: Run Phase 2D validator
        run: |
          set -e
          python phase2d_prospective_validator.py

      - name: Upload Phase 2D state
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-state
          path: |
            research_outputs/phase2d_state.json
            research_outputs/phase2d_results.json
            research_outputs/phase2d_latest_snapshot.json
          if-no-files-found: error
          retention-days: 20
