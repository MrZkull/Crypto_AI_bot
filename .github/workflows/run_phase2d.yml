name: CryptoBot AI — Phase 2D Prospective Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: cryptobot-phase2d
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow fastparquet

      - name: Restore previous Phase 2D state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p research_outputs

          RUN_ID=$(
            gh run list \
              --workflow="run_phase2d.yml" \
              --limit 20 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "success") | .databaseId' \
            | head -n 1 || true
          )

          if [ -n "$RUN_ID" ]; then
            echo "Restoring state from run $RUN_ID"

            gh run download \
              "$RUN_ID" \
              -n phase2d-state \
              -D research_outputs \
              || true
          else
            echo "No previous state found."
          fi

      - name: Download locked HTF-removal candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh run download \
            35139155066 \
            -n htf-removal-candidate \
            -D phase2d_candidate

          cp phase2d_candidate/candidate_model.pkl .
          cp phase2d_candidate/candidate_manifest.json .

          test -s candidate_model.pkl

      - name: Verify candidate identity
        run: |
          python - <<'PY'
          import hashlib

          expected = (
              "45064fddd32f2e23eb4c34ed56bcbe73a8a1bffc"
              "90b8b9b6d82fc3838c4308c2"
          )

          actual = hashlib.sha256(
              open("candidate_model.pkl", "rb").read()
          ).hexdigest()

          print("Candidate SHA256:", actual)

          if actual != expected:
              raise SystemExit(
                  "FATAL: candidate SHA mismatch"
              )
          PY

      - name: Download locked production model from release v2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh release download \
            v2.0 \
            --repo "${{ github.repository }}" \
            --pattern 'pro_crypto_ai_model.pkl' \
            --dir . \
            --clobber

          test -s pro_crypto_ai_model.pkl

          ls -lh pro_crypto_ai_model.pkl

      # IMPORTANT:
      # Do not archive/clone v2.0.
      # Retrieve only the legacy feature-engineering source.
      - name: Download exact v2.0 feature engineering
        run: |
          set -e

          mkdir -p legacy_v20

          curl -fL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${{ github.repository }}/v2.0/feature_engineering.py" \
            -o legacy_v20/feature_engineering.py

          test -s legacy_v20/feature_engineering.py

          echo "v2.0 feature_engineering.py:"
          sha256sum legacy_v20/feature_engineering.py

      - name: Verify models
        run: |
          python - <<'PY'
          import hashlib
          import joblib

          for filename in [
              "candidate_model.pkl",
              "pro_crypto_ai_model.pkl",
          ]:
              sha = hashlib.sha256(
                  open(filename, "rb").read()
              ).hexdigest()

              model = joblib.load(filename)

              print(
                  filename,
                  "SHA256:",
                  sha
              )

              print(
                  filename,
                  "features:",
                  len(model["all_features"])
              )

              print(
                  filename,
                  "trained_at:",
                  model.get("trained_at")
              )
          PY

      - name: Run Phase 2D validator
        env:
          PHASE2D_LEGACY_FE: legacy_v20/feature_engineering.py
        run: |
          set -e
          python phase2d_prospective_validator.py

      - name: Upload Phase 2D state
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-state
          path: |
            research_outputs/phase2d_state.json
            research_outputs/phase2d_results.json
            research_outputs/phase2d_latest_snapshot.json
          if-no-files-found: error
          retention-days: 20
