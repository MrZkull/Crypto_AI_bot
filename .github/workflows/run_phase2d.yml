name: CryptoBot AI — Phase 2D Prospective Validation

on:
  workflow_dispatch:
    inputs:
      candidate_release_tag:
        description: "Candidate GitHub Release tag"
        required: true
        default: "phase2d-htf-removal-candidate-20260921"
        type: string

      production_release_tag:
        description: "Immutable production release tag to evaluate"
        required: false
        default: "v2.0"
        type: string

      experiment_id:
        description: "Explicit Phase 2D experiment identity"
        required: false
        default: "PHASE2D-HARDENED-20260924-F08"
        type: string

      allow_fresh_start:
        description: "Explicitly authorize a new Phase 2D state when no compatible state exists"
        required: false
        default: false
        type: boolean

      reconcile_f08_ledger:
        description: "One-time F08 historical observation-ledger reconciliation; must be run on main"
        required: false
        default: false
        type: boolean

  # External scheduler contract:
  # cron-job.org is the 2-hour scheduler for this workflow.
  #
  # It may call the GitHub Actions workflow-dispatch endpoint directly
  # (preferred) or send a repository_dispatch event.
  #
  # IMPORTANT: there is intentionally NO native GitHub schedule here.
  # This prevents duplicate Phase 2D executions.
  repository_dispatch:

concurrency:
  group: cryptobot-phase2d
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.11"

  CANDIDATE_MODEL_FILE: "candidate_model.pkl"
  PRODUCTION_MODEL_FILE: "pro_crypto_ai_model.pkl"

  STATE_ARTIFACT_NAME: "phase2d-state"
  STATE_DIR: "research_outputs"

  CANDIDATE_RELEASE_TAG_DEFAULT: "phase2d-htf-removal-candidate-20260921"
  PRODUCTION_RELEASE_TAG_DEFAULT: "v2.0"
  PHASE2D_EXPERIMENT_ID_DEFAULT: "PHASE2D-HARDENED-20260924-F08"

jobs:
  prospective:
    if: ${{ inputs.reconcile_f08_ledger != true && github.event.client_payload.reconcile_f08_ledger != true && github.event.client_payload.reconcile_f08_ledger != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # RUN CONTEXT
      # ============================================================
      - name: Run context
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_TAG="${{ inputs.candidate_release_tag || github.event.client_payload.candidate_release_tag || env.CANDIDATE_RELEASE_TAG_DEFAULT }}"
          PRODUCTION_TAG="${{ inputs.production_release_tag || github.event.client_payload.production_release_tag || env.PRODUCTION_RELEASE_TAG_DEFAULT }}"
          EXPERIMENT_ID="${{ inputs.experiment_id || github.event.client_payload.experiment_id || env.PHASE2D_EXPERIMENT_ID_DEFAULT }}"
          ALLOW_FRESH_START="${{ inputs.allow_fresh_start || github.event.client_payload.allow_fresh_start || false }}"

          echo "============================================================"
          echo " CRYPTOBOT AI — PHASE 2D PROSPECTIVE VALIDATION"
          echo "============================================================"
          echo "Repository             : ${GITHUB_REPOSITORY}"
          echo "Commit                 : ${GITHUB_SHA}"
          echo "Run                    : ${GITHUB_RUN_ID}"
          echo "Attempt                : ${GITHUB_RUN_ATTEMPT}"
          echo "Event                  : ${GITHUB_EVENT_NAME}"
          echo "Ref                    : ${GITHUB_REF}"
          echo "Candidate Release      : ${CANDIDATE_TAG}"
          echo "Production Release     : ${PRODUCTION_TAG}"
          echo "Experiment ID          : ${EXPERIMENT_ID}"
          echo "Fresh-start authorized : ${ALLOW_FRESH_START}"
          echo "Python                 : ${PYTHON_VERSION}"
          echo "Cadence                : External cron-job.org every 2 hours"
          echo "============================================================"

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          pip install -r requirements.txt

          echo "============================================================"
          echo " DEPENDENCY STATUS"
          echo "============================================================"
          python --version
          python -c "import numpy, pandas, sklearn, xgboost, joblib, requests; print('Core dependencies: PASS')"

      # ============================================================
      # WORKSPACE
      # ============================================================
      - name: Prepare Phase 2D workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${STATE_DIR}" phase2d_candidate

          rm -f \
            "${CANDIDATE_MODEL_FILE}" \
            "${PRODUCTION_MODEL_FILE}"

          echo "Workspace prepared."

      # ============================================================
      # SOURCE INTEGRITY — HASHES
      # ============================================================
      - name: Calculate experiment source hashes
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_FEATURE_CODE_SHA="$(sha256sum feature_engineering.py | awk '{print $1}')"
          EXPECTED_VALIDATOR_CODE_SHA="$(sha256sum phase2d_prospective_validator.py | awk '{print $1}')"

          EXPECTED_FEATURE_SCHEMA_SHA="$(
            python - <<'PY'
          import hashlib
          import json
          from feature_engineering import ALL_FEATURES

          payload = json.dumps(
              {"all_features": list(ALL_FEATURES)},
              ensure_ascii=True,
              separators=(",", ":"),
          ).encode("utf-8")

          print(hashlib.sha256(payload).hexdigest())
          PY
          )"

          {
            echo "EXPECTED_FEATURE_CODE_SHA=${EXPECTED_FEATURE_CODE_SHA}"
            echo "EXPECTED_VALIDATOR_CODE_SHA=${EXPECTED_VALIDATOR_CODE_SHA}"
            echo "EXPECTED_FEATURE_SCHEMA_SHA=${EXPECTED_FEATURE_SCHEMA_SHA}"
          } >> "${GITHUB_ENV}"

          echo "============================================================"
          echo " EXPERIMENT SOURCE HASHES"
          echo "============================================================"
          echo "Feature code SHA     : ${EXPECTED_FEATURE_CODE_SHA}"
          echo "Feature schema SHA   : ${EXPECTED_FEATURE_SCHEMA_SHA}"
          echo "Validator code SHA   : ${EXPECTED_VALIDATOR_CODE_SHA}"
          echo "============================================================"

      # ============================================================
      # RESTORE / RESET POLICY
      # ============================================================
      - name: Restore previous Phase 2D state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_SHA="7213987874543e5d6e18b0bac32556647d40080b3e4222532e40a225a1bf08a3"
          PRODUCTION_SHA="f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"
          EXPERIMENT_ID="${{ inputs.experiment_id || github.event.client_payload.experiment_id || env.PHASE2D_EXPERIMENT_ID_DEFAULT }}"
          ALLOW_FRESH_START="${{ inputs.allow_fresh_start || github.event.client_payload.allow_fresh_start || false }}"

          echo "============================================================"
          echo " STATE RESTORE / EXPERIMENT CONTINUITY"
          echo "============================================================"
          echo "Experiment ID          : ${EXPERIMENT_ID}"
          echo "Candidate SHA          : ${CANDIDATE_SHA}"
          echo "Production SHA         : ${PRODUCTION_SHA}"
          echo "Feature code SHA       : ${EXPECTED_FEATURE_CODE_SHA}"
          echo "Feature schema SHA     : ${EXPECTED_FEATURE_SCHEMA_SHA}"
          echo "Validator code SHA     : ${EXPECTED_VALIDATOR_CODE_SHA}"
          echo "Fresh-start authorized : ${ALLOW_FRESH_START}"
          echo "============================================================"

          if [[ "${ALLOW_FRESH_START}" == "true" ]]; then
            echo "Explicit fresh-start mode is ACTIVE."
            echo "No prior Phase 2D state will be reused."

            LATEST_RUN_ID="$(
              gh run list \
                --workflow="run_phase2d.yml" \
                --branch main \
                --limit 20 \
                --json databaseId,conclusion \
                --jq '.[] | select(.conclusion == "success") | .databaseId' \
                | head -n 1 || true
            )"

            if [[ -n "${LATEST_RUN_ID}" ]]; then
              rm -rf inspect_state
              mkdir -p inspect_state

              if gh run download \
                  "${LATEST_RUN_ID}" \
                  -n "${STATE_ARTIFACT_NAME}" \
                  -D inspect_state \
                  2>/dev/null; then

                ARCHIVE_DIR="${STATE_DIR}/pre_reset_archive/run_${LATEST_RUN_ID}"
                mkdir -p "${ARCHIVE_DIR}"
                archived=0

                for f in \
                  phase2d_state.json \
                  phase2d_results.json \
                  phase2d_latest_snapshot.json \
                  experiment_ledger.jsonl \
                  phase2d_observations.jsonl \
                  phase2d_validator.log
                do
                  src="$(find inspect_state -type f -name "${f}" -print -quit || true)"

                  if [[ -n "${src}" ]]; then
                    cp "${src}" "${ARCHIVE_DIR}/${f}"
                    echo "Archived: ${f}"
                    archived=$((archived + 1))
                  fi
                done

                rm -rf inspect_state
                echo "Historical archive status : ${archived} file(s) archived"
                echo "Historical source run     : ${LATEST_RUN_ID}"
              else
                rm -rf inspect_state
                echo "No prior state artifact available to archive."
              fi
            else
              echo "No prior successful Phase 2D run exists."
            fi

            # Explicit reset: nothing from the previous experiment remains live.
            rm -f \
              "${STATE_DIR}/phase2d_state.json" \
              "${STATE_DIR}/phase2d_results.json" \
              "${STATE_DIR}/phase2d_latest_snapshot.json" \
              "${STATE_DIR}/experiment_ledger.jsonl" \
              "${STATE_DIR}/phase2d_observations.jsonl" \
              "phase2d_validator.log"

            rm -rf inspect_state
            mkdir -p "${STATE_DIR}"

            echo "STATE RESTORE STATUS      : EXPLICIT FRESH START"
            echo "Live Phase 2D state      : CLEARED"
            echo "Validator will continue  : YES"

          else
            echo "Normal continuation mode is ACTIVE."
            echo "Searching only for an exactly compatible successful state."

            rm -f \
              "${STATE_DIR}/phase2d_state.json" \
              "${STATE_DIR}/phase2d_results.json" \
              "${STATE_DIR}/phase2d_latest_snapshot.json" \
              "${STATE_DIR}/experiment_ledger.jsonl" \
              "phase2d_validator.log"

            rm -rf inspect_state
            mkdir -p "${STATE_DIR}"

            RUN_IDS="$(
              gh run list \
                --workflow="run_phase2d.yml" \
                --branch main \
                --limit 20 \
                --json databaseId,conclusion \
                --jq '.[] | select(.conclusion == "success") | .databaseId'
            )"

            RESTORED_RUN_ID=""

            for rid in ${RUN_IDS}; do
              rm -rf inspect_state
              mkdir -p inspect_state

              if ! gh run download \
                  "${rid}" \
                  -n "${STATE_ARTIFACT_NAME}" \
                  -D inspect_state \
                  2>/dev/null; then
                rm -rf inspect_state
                continue
              fi

              state_file="$(find inspect_state -type f -name "phase2d_state.json" ! -path '*/pre_reconciliation_archive/*' -print -quit || true)"

              if [[ -z "${state_file}" ]]; then
                rm -rf inspect_state
                continue
              fi

              observation_ledger_file="$(
                find inspect_state \
                  -type f \
                  -name "phase2d_observations.jsonl" \
                  ! -path '*/pre_reconciliation_archive/*' \
                  -print -quit || true
              )"

              set +e

              python - "${state_file}" \
                "${CANDIDATE_SHA}" \
                "${PRODUCTION_SHA}" \
                "${EXPECTED_FEATURE_CODE_SHA}" \
                "${EXPECTED_FEATURE_SCHEMA_SHA}" \
                "${EXPECTED_VALIDATOR_CODE_SHA}" \
                "${EXPERIMENT_ID}" \
                "${observation_ledger_file}" <<'PY'
          import json
          import sys

          (
              state_file,
              expected_candidate,
              expected_production,
              expected_feature_code,
              expected_feature_schema,
              expected_validator_code,
              expected_experiment_id,
              observation_ledger_file,
          ) = sys.argv[1:]

          with open(state_file, encoding="utf-8") as handle:
              state = json.load(handle)

          locked = state.get("locked_models", {})

          expected = {
              "candidate_sha256": expected_candidate,
              "production_sha256": expected_production,
              "feature_code_hash": expected_feature_code,
              "feature_schema_hash": expected_feature_schema,
              "validator_code_hash": expected_validator_code,
              "experiment_id": expected_experiment_id,
          }

          mismatches = {}

          stored_schema = state.get("schema_version")
          controlled_f08_migration = (
              stored_schema in {5, 6}
              and expected_experiment_id == "PHASE2D-HARDENED-20260924-F08"
              and locked.get("experiment_id") == expected_experiment_id
          )

          for key, expected_value in expected.items():
              actual_value = locked.get(key)

              if (
                  key == "validator_code_hash"
                  and controlled_f08_migration
              ):
                  continue

              if actual_value != expected_value:
                  mismatches[key] = {
                      "expected": expected_value,
                      "actual": actual_value,
                  }

          if state.get("schema_version") not in {5, 6}:
              mismatches["state_schema_version"] = {
                  "expected": "{5, 6}",
                  "actual": state.get("schema_version"),
              }

          # Completed F08 normal continuation requires the
          # reconciled immutable observation ledger.
          if (
              expected_experiment_id
              == "PHASE2D-HARDENED-20260924-F08"
          ):
              from pathlib import Path

              if not observation_ledger_file:
                  mismatches["observation_ledger"] = {
                      "expected": (
                          "phase2d_observations.jsonl with "
                          "F08_LEDGER_HISTORICAL_RECONCILIATION"
                      ),
                      "actual": "missing",
                  }
              else:
                  ledger_path = Path(observation_ledger_file)

                  if not ledger_path.exists():
                      mismatches["observation_ledger"] = {
                          "expected": (
                              "phase2d_observations.jsonl with "
                              "F08_LEDGER_HISTORICAL_RECONCILIATION"
                          ),
                          "actual": "missing",
                      }
                  else:
                      observation_count = 0
                      reconciliation_events = []

                      with ledger_path.open(encoding="utf-8") as handle:
                          for line in handle:
                              line = line.strip()

                              if not line:
                                  continue

                              record = json.loads(line)

                              if record.get("record_type") == "observation":
                                  observation_count += 1

                              if (
                                  record.get("event")
                                  == "F08_LEDGER_HISTORICAL_RECONCILIATION"
                              ):
                                  reconciliation_events.append(record)

                      migration = state.get(
                          "observation_ledger",
                          {},
                      ).get(
                          "migration",
                          {},
                      )

                      reconciliation_metadata = (
                          migration.get("historical_reconciliation")
                          if isinstance(migration, dict)
                          else None
                      )

                      if not reconciliation_events:
                          mismatches[
                              "observation_ledger_reconciliation"
                          ] = {
                              "expected": (
                                  "F08_LEDGER_HISTORICAL_RECONCILIATION"
                              ),
                              "actual": "missing",
                          }

                      if not isinstance(reconciliation_metadata, dict):
                          mismatches[
                              "historical_reconciliation_metadata"
                          ] = {
                              "expected": (
                                  "observation_ledger.migration."
                                  "historical_reconciliation"
                              ),
                              "actual": "missing",
                          }
                      else:
                          expected_observation_count = (
                              reconciliation_metadata.get(
                                  "historical_unique_observations"
                              )
                          )

                          if (
                              expected_observation_count is None
                              or observation_count
                              < expected_observation_count
                          ):
                              mismatches[
                                  "observation_ledger_count"
                              ] = {
                                  "expected": expected_observation_count,
                                  "actual": observation_count,
                              }

                      if reconciliation_events:
                          latest_reconciliation = (
                              reconciliation_events[-1]
                          )

                          if (
                              latest_reconciliation.get(
                                  "remaining_missing"
                              )
                              != 0
                          ):
                              mismatches[
                                  "historical_reconciliation_remaining"
                              ] = {
                                  "expected": 0,
                                  "actual": (
                                      latest_reconciliation.get(
                                          "remaining_missing"
                                      )
                                  ),
                              }

          if mismatches:
              print("STATE_IDENTITY: INCOMPATIBLE")
              print(json.dumps(mismatches, indent=2, sort_keys=True))
              raise SystemExit(2)

          candidate_resolved = len(
              state.get("resolved", {}).get("candidate", [])
          )

          production_resolved = len(
              state.get("resolved", {}).get("production", [])
          )

          candidate_pending = len(
              state.get("pending", {}).get("candidate", [])
          )

          production_pending = len(
              state.get("pending", {}).get("production", [])
          )

          print("STATE_IDENTITY: COMPATIBLE")
          print(f"candidate_resolved={candidate_resolved}")
          print(f"production_resolved={production_resolved}")
          print(f"candidate_pending={candidate_pending}")
          print(f"production_pending={production_pending}")
          PY
              status=$?

              set -e

              if [[ "${status}" -eq 0 ]]; then
                echo "Compatible Phase 2D state found in Run #${rid}."

                for f in \
                  phase2d_state.json \
                  phase2d_results.json \
                  phase2d_latest_snapshot.json \
                  experiment_ledger.jsonl \
                  phase2d_observations.jsonl
                do
                  src="$(find inspect_state -type f -name "${f}" ! -path '*/pre_reconciliation_archive/*' -print -quit || true)"

                  if [[ -n "${src}" ]]; then
                    cp "${src}" "${STATE_DIR}/${f}"
                    echo "Restored: ${f}"
                  fi
                done

                RESTORED_RUN_ID="${rid}"
                rm -rf inspect_state
                break
              fi

              echo "Run #${rid}: incompatible state skipped."
              rm -rf inspect_state
            done

            if [[ -n "${RESTORED_RUN_ID}" ]]; then
              echo "============================================================"
              echo " STATE RESTORE STATUS: PASS"
              echo " Restored from Run #${RESTORED_RUN_ID}"
              echo "============================================================"
            else
              echo "============================================================"
              echo " STATE RESTORE STATUS: BLOCKED"
              echo " No compatible prior state exists."
              echo " Fresh start is NOT authorized."
              echo "============================================================"
              exit 1
            fi
          fi

      # ============================================================
      # DOWNLOAD LOCKED CANDIDATE RELEASE
      # ============================================================
      - name: Download candidate Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_RELEASE_TAG="${{ inputs.candidate_release_tag || github.event.client_payload.candidate_release_tag || env.CANDIDATE_RELEASE_TAG_DEFAULT }}"

          if [[ -z "${CANDIDATE_RELEASE_TAG}" ]]; then
            echo "FATAL: candidate release tag is empty."
            exit 1
          fi

          echo "============================================================"
          echo " CANDIDATE RELEASE"
          echo "============================================================"
          echo "Release tag: ${CANDIDATE_RELEASE_TAG}"

          rm -rf phase2d_candidate
          mkdir -p phase2d_candidate

          gh release download "${CANDIDATE_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${CANDIDATE_MODEL_FILE}" \
            --dir phase2d_candidate \
            --clobber

          test -s "phase2d_candidate/${CANDIDATE_MODEL_FILE}"

          cp \
            "phase2d_candidate/${CANDIDATE_MODEL_FILE}" \
            "./${CANDIDATE_MODEL_FILE}"

          echo "Downloaded candidate Release asset:"
          ls -lh "${CANDIDATE_MODEL_FILE}"

      # ============================================================
      # VERIFY LOCKED CANDIDATE
      # ============================================================
      - name: Verify locked candidate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = "7213987874543e5d6e18b0bac32556647d40080b3e4222532e40a225a1bf08a3"
          path = Path("candidate_model.pkl")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()

          print("============================================================")
          print(" CANDIDATE MODEL IDENTITY")
          print("============================================================")
          print("Expected SHA256:", expected)
          print("Actual SHA256  :", actual)
          print("Size (bytes)   :", path.stat().st_size)

          if actual != expected:
              raise SystemExit(
                  "FATAL: candidate SHA does not match locked candidate."
              )

          print("STATUS         : PASS")
          PY

      # ============================================================
      # INSPECT CANDIDATE
      # ============================================================
      - name: Inspect candidate model
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import joblib
          from pathlib import Path

          model = joblib.load(
              Path("candidate_model.pkl")
          )

          if not isinstance(model, dict):
              raise SystemExit(
                  "FATAL: unexpected candidate model type."
              )

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }

          missing = required - set(model)

          if missing:
              raise SystemExit(
                  f"FATAL: candidate model missing keys: {sorted(missing)}"
              )

          declared = [
              str(x)
              for x in model["all_features"]
          ]

          selected = [
              str(x)
              for x in model["best_features"]
          ]

          print("============================================================")
          print(" CANDIDATE MODEL SCHEMA")
          print("============================================================")
          print("trained_at          :", model.get("trained_at"))
          print("declared features   :", len(declared))
          print("selected features   :", len(selected))
          print("selected feature list:")
          for feature in selected:
              print(f"  - {feature}")

          missing_from_declared = [
              x
              for x in selected
              if x not in declared
          ]

          if missing_from_declared:
              raise SystemExit(
                  "FATAL: candidate best_features contains "
                  f"undeclared features: {missing_from_declared}"
              )

          print("STATUS              : PASS")
          PY

      # ============================================================
      # DOWNLOAD LOCKED PRODUCTION RELEASE
      # ============================================================
      - name: Download locked production model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ inputs.production_release_tag || github.event.client_payload.production_release_tag || env.PRODUCTION_RELEASE_TAG_DEFAULT }}"

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "FATAL: production release tag is empty."
            exit 1
          fi

          echo "============================================================"
          echo " PRODUCTION RELEASE"
          echo "============================================================"
          echo "Release tag: ${RELEASE_TAG}"

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${PRODUCTION_MODEL_FILE}" \
            --dir . \
            --clobber

          test -s "${PRODUCTION_MODEL_FILE}"

          ls -lh "${PRODUCTION_MODEL_FILE}"

      # ============================================================
      # VERIFY LOCKED PRODUCTION + SCHEMA
      # ============================================================
      - name: Verify locked production
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import joblib
          from pathlib import Path

          expected = "f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"

          path = Path(
              "pro_crypto_ai_model.pkl"
          )

          actual = hashlib.sha256(
              path.read_bytes()
          ).hexdigest()

          print("============================================================")
          print(" PRODUCTION MODEL IDENTITY / SCHEMA")
          print("============================================================")
          print("Expected SHA256:", expected)
          print("Actual SHA256  :", actual)
          print("Size (bytes)   :", path.stat().st_size)

          if actual != expected:
              raise SystemExit(
                  "FATAL: production SHA does not match locked production."
              )

          model = joblib.load(path)

          if not isinstance(model, dict):
              raise SystemExit(
                  "FATAL: unexpected production model type."
              )

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }

          missing = required - set(model)

          if missing:
              raise SystemExit(
                  f"FATAL: production model missing keys: {sorted(missing)}"
              )

          declared = [
              str(x)
              for x in model["all_features"]
          ]

          selected = [
              str(x)
              for x in model["best_features"]
          ]

          print("trained_at          :", model.get("trained_at"))
          print("declared features   :", len(declared))
          print("selected features   :", len(selected))
          print("selected feature list:")

          for feature in selected:
              print(f"  - {feature}")

          if len(declared) != 63:
              raise SystemExit(
                  "FATAL: expected 63 production declared "
                  f"features, got {len(declared)}"
              )

          if len(selected) != 35:
              raise SystemExit(
                  "FATAL: expected 35 production selected "
                  f"features, got {len(selected)}"
              )

          missing_from_declared = [
              x
              for x in selected
              if x not in declared
          ]

          if missing_from_declared:
              raise SystemExit(
                  "FATAL: production best_features contains "
                  "features not present in all_features: "
                  f"{missing_from_declared}"
              )

          print("STATUS              : PASS")
          PY

      # ============================================================
      # SOURCE DEPENDENCY VALIDATION
      # ============================================================
      - name: Validate Phase 2D source dependencies
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "phase2d_prospective_validator.py"
            "phase2d_promotion_gate.py"
            "feature_engineering.py"
            "market_data_integrity.py"
            "phase2d_observation_ledger.py"
          )

          echo "============================================================"
          echo " PHASE 2D SOURCE DEPENDENCY CHECK"
          echo "============================================================"

          for f in "${required_files[@]}"; do
            test -s "${f}" || {
              echo "FATAL: missing required Phase 2D source file: ${f}"
              exit 1
            }

            echo "PASS: ${f}"
          done

          python -m py_compile \
            phase2d_prospective_validator.py \
            phase2d_promotion_gate.py \
            feature_engineering.py \
            market_data_integrity.py \
            phase2d_observation_ledger.py

          echo "============================================================"
          echo " PYCOMPILE STATUS: PASS"
          echo "============================================================"

      # ============================================================
      # TEST SUITE
      # ============================================================
      - name: Run full regression test suite
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " FULL REGRESSION TEST SUITE"
          echo "============================================================"

          python -m pytest -v

          echo "============================================================"
          echo " FULL REGRESSION TEST STATUS: PASS"
          echo "============================================================"

      # ============================================================
      # RUN PROSPECTIVE VALIDATOR
      # ============================================================
      - name: Run Phase 2D validator
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PHASE2D_EXPERIMENT_ID: ${{ inputs.experiment_id || github.event.client_payload.experiment_id || env.PHASE2D_EXPERIMENT_ID_DEFAULT }}
        run: |
          set -euo pipefail

          FRESH_START_ARG=""

          if [[ "${{ inputs.allow_fresh_start || github.event.client_payload.allow_fresh_start || false }}" == "true" ]]; then
            FRESH_START_ARG="--allow-fresh-start"
          fi

          echo "============================================================"
          echo " PHASE 2D VALIDATOR — FULL STRUCTURED LIVE LOG"
          echo "============================================================"
          echo "Experiment ID          : ${PHASE2D_EXPERIMENT_ID}"
          echo "Fresh-start authorized : ${{ inputs.allow_fresh_start || github.event.client_payload.allow_fresh_start || false }}"
          echo "============================================================"

          python phase2d_prospective_validator.py \
            ${FRESH_START_ARG} \
            2>&1 | tee phase2d_validator.log

          echo
          echo "============================================================"
          echo " PHASE 2D VALIDATOR COMPLETE"
          echo "============================================================"

      # ============================================================
      # PRINT RESULT SUMMARY
      # ============================================================
      - name: Print Phase 2D result summary
        if: always()
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo " PHASE 2D RESULT SUMMARY"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("research_outputs/phase2d_state.json"),
              Path("research_outputs/phase2d_results.json"),
              Path("research_outputs/phase2d_latest_snapshot.json"),
          ]

          for path in files:
              print()
              print(f"FILE: {path}")

              if not path.exists():
                  print("STATUS: MISSING")
                  continue

              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      "STATUS: INVALID JSON:",
                      exc,
                  )
                  continue

              print("STATUS: PRESENT")

              if isinstance(data, dict):
                  print(
                      "top-level keys:",
                      sorted(data.keys()),
                  )

                  for key in (
                      "overall_status",
                      "next_action",
                      "candidate",
                      "production",
                      "promotion_gate",
                      "side_breakdowns",
                      "integrity",
                      "run_metrics",
                      "resolution_metrics",
                  ):
                      if key not in data:
                          continue

                      value = data[key]

                      if isinstance(
                          value,
                          dict,
                      ):
                          print(
                              f"{key}:"
                          )
                          print(
                              json.dumps(
                                  value,
                                  indent=2,
                                  sort_keys=True,
                              )
                          )
                      else:
                          print(
                              f"{key}: {value}"
                          )
              else:
                  print(
                      "JSON type:",
                      type(data).__name__,
                  )
          PY

          echo
          echo "Recent validator log:"
          tail -n 160 \
            phase2d_validator.log \
            2>/dev/null || true

      # ============================================================
      # GITHUB ACTIONS SUMMARY
      # ============================================================
      - name: Write GitHub Actions summary
        if: always()
        shell: bash
        run: |
          set -u

          CANDIDATE_TAG="${{ inputs.candidate_release_tag || github.event.client_payload.candidate_release_tag || env.CANDIDATE_RELEASE_TAG_DEFAULT }}"
          PRODUCTION_TAG="${{ inputs.production_release_tag || github.event.client_payload.production_release_tag || env.PRODUCTION_RELEASE_TAG_DEFAULT }}"
          EXPERIMENT_ID="${{ inputs.experiment_id || github.event.client_payload.experiment_id || env.PHASE2D_EXPERIMENT_ID_DEFAULT }}"

          {
            echo "# CryptoBot AI — Phase 2D Prospective Validation"
            echo
            echo "## Run Context"
            echo
            echo "- **Run:** ${GITHUB_RUN_ID}"
            echo "- **Attempt:** ${GITHUB_RUN_ATTEMPT}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Event:** ${GITHUB_EVENT_NAME}"
            echo "- **Experiment ID:** ${EXPERIMENT_ID}"
            echo "- **Candidate Release:** ${CANDIDATE_TAG}"
            echo "- **Production Release:** ${PRODUCTION_TAG}"
            echo "- **Fresh-start authorized:** ${{ inputs.allow_fresh_start || github.event.client_payload.allow_fresh_start || false }}"
            echo "- **Cadence:** External cron-job.org every 2 hours"
            echo
            echo "## Locked identities"
            echo
            echo "- **Candidate model SHA:** \`7213987874543e5d6e18b0bac32556647d40080b3e4222532e40a225a1bf08a3\`"
            echo "- **Production model SHA:** \`f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21\`"
            echo "- **Feature code SHA:** \`${EXPECTED_FEATURE_CODE_SHA:-not-computed}\`"
            echo "- **Feature schema SHA:** \`${EXPECTED_FEATURE_SCHEMA_SHA:-not-computed}\`"
            echo "- **Validator code SHA:** \`${EXPECTED_VALIDATOR_CODE_SHA:-not-computed}\`"
            echo
            echo "## Phase 2D result"

            if [[ -f "research_outputs/phase2d_results.json" ]]; then
              python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "research_outputs/phase2d_results.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          gate = data.get(
              "promotion_gate",
              {},
          )

          candidate = data.get(
              "candidate",
              {},
          )

          production = data.get(
              "production",
              {},
          )

          print(
              f"- **Overall status:** {data.get('overall_status')}"
          )

          print(
              f"- **Next action:** {data.get('next_action')}"
          )

          print(
              f"- **Candidate clean N:** {gate.get('n_candidate')}"
          )

          print(
              f"- **Production clean N:** {gate.get('n_production')}"
          )

          print(
              f"- **Candidate unique blocks:** {gate.get('unique_blocks_candidate')}"
          )

          print(
              f"- **Production unique blocks:** {gate.get('unique_blocks_production')}"
          )

          print(
              f"- **Candidate precision:** {candidate.get('precision_excluding_ambiguous')}"
          )

          print(
              f"- **Candidate mean Net-R:** {candidate.get('mean_net_r')}"
          )

          print(
              f"- **Production precision:** {production.get('precision_excluding_ambiguous')}"
          )

          print(
              f"- **Production mean Net-R:** {production.get('mean_net_r')}"
          )

          print(
              f"- **Promotion gate:** {gate.get('gate_status')}"
          )

          print(
              f"- **Candidate profitable:** {gate.get('candidate_profitable')}"
          )

          print(
              f"- **Candidate beats production:** {gate.get('candidate_beats_production')}"
          )
          PY
            else
              echo "- **Result JSON:** MISSING"
            fi

            echo
            echo "## Artifacts"

            for f in \
              research_outputs/phase2d_state.json \
              research_outputs/phase2d_results.json \
              research_outputs/phase2d_latest_snapshot.json \
              research_outputs/experiment_ledger.jsonl \
              phase2d_validator.log
            do
              if [[ -f "${f}" ]]; then
                echo "- \`${f}\`: PRESENT"
              else
                echo "- \`${f}\`: MISSING"
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # UPLOAD PHASE 2D STATE + AUDIT ARTIFACTS
      # ============================================================
      - name: Upload Phase 2D research artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-state
          path: |
            research_outputs/phase2d_state.json
            research_outputs/phase2d_results.json
            research_outputs/phase2d_latest_snapshot.json
            research_outputs/experiment_ledger.jsonl
            research_outputs/phase2d_observations.jsonl
            research_outputs/pre_reset_archive/**
            phase2d_validator.log
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # UPLOAD FAILURE DIAGNOSTICS (NEVER USED FOR STATE RESTORE)
      # ============================================================
      - name: Upload Phase 2D failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-failure-diagnostics
          path: |
            phase2d_validator.log
            research_outputs/pre_reset_archive/**
          if-no-files-found: ignore
          retention-days: 14
  # ============================================================
  # ONE-TIME F08 HISTORICAL LEDGER RECONCILIATION
  # ============================================================
  reconcile_f08_ledger:
    if: ${{ inputs.reconcile_f08_ledger == true || github.event.client_payload.reconcile_f08_ledger == true || github.event.client_payload.reconcile_f08_ledger == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # MAIN-BRANCH GUARD
      # ============================================================
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository ref: ${GITHUB_REF}"

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "FATAL: F08 ledger reconciliation must run on main."
            echo "The resulting phase2d-state artifact is consumed by normal"
            echo "Phase 2D restore logic only from successful runs on main."
            exit 1
          fi

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          pip install -r requirements.txt

          python --version
          python -c "import numpy, pandas, sklearn, xgboost, joblib, requests; print('Core dependencies: PASS')"

      # ============================================================
      # CODE VALIDATION
      # ============================================================
      - name: Validate reconciliation code
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            phase2d_observation_ledger.py \
            phase2d_f08_reconciliation.py \
            phase2d_prospective_validator.py

          python -m pytest -q

      # ============================================================
      # DOWNLOAD ALL SUCCESSFUL PHASE 2D STATE ARTIFACTS
      # ============================================================
      - name: Collect historical successful Phase 2D state artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf historical_phase2d
          mkdir -p historical_phase2d

          echo "============================================================"
          echo " COLLECTING SUCCESSFUL PHASE 2D STATE ARTIFACTS"
          echo "============================================================"

          RUN_IDS="$(
            gh run list \
              --workflow="run_phase2d.yml" \
              --branch main \
              --limit 1000 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "success") | .databaseId'
          )"

          if [[ -z "${RUN_IDS}" ]]; then
            echo "FATAL: no successful Phase 2D runs found on main."
            exit 1
          fi

          downloaded=0
          skipped=0

          for rid in ${RUN_IDS}; do
            out="historical_phase2d/run_${rid}"
            mkdir -p "${out}"

            if gh run download \
                "${rid}" \
                -n "phase2d-state" \
                -D "${out}" \
                2>/dev/null; then
              echo "Downloaded state artifact from Run #${rid}"
              downloaded=$((downloaded + 1))
            else
              echo "Run #${rid}: no phase2d-state artifact; skipping."
              rm -rf "${out}"
              skipped=$((skipped + 1))
            fi
          done

          echo
          echo "State artifacts downloaded : ${downloaded}"
          echo "Runs without state artifact: ${skipped}"

          if [[ "${downloaded}" -eq 0 ]]; then
            echo "FATAL: no phase2d-state artifacts could be downloaded."
            exit 1
          fi

      # ============================================================
      # RECONCILE
      # ============================================================
      - name: Reconcile F08 historical observation ledger
        shell: bash
        env:
          EXPECTED_EXPERIMENT_ID: "PHASE2D-HARDENED-20260924-F08"
        run: |
          set -euo pipefail

          rm -rf research_outputs
          mkdir -p research_outputs
          rm -rf research_outputs/pre_reconciliation_archive

          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          import phase2d_f08_reconciliation as reconciliation
          import phase2d_observation_ledger as ledger

          ROOT = Path("historical_phase2d")
          OUT = Path("research_outputs")
          EXPERIMENT_ID = "PHASE2D-HARDENED-20260924-F08"

          state_entries = []

          for state_path in sorted(
              ROOT.glob("run_*/**/phase2d_state.json"),
              key=lambda p: int(
                  re.search(r"run_(\d+)", str(p)).group(1)
              ),
          ):
              run_match = re.search(
                  r"run_(\d+)",
                  str(state_path),
              )

              if not run_match:
                  continue

              run_id = int(run_match.group(1))

              state = reconciliation.load_state(state_path)

              actual_experiment = (
                  state.get("experiment_definition", {})
                  .get("experiment_id")
                  or state.get("locked_models", {})
                  .get("experiment_id")
              )

              if actual_experiment != EXPERIMENT_ID:
                  continue

              state_entries.append(
                  {
                      "run_id": run_id,
                      "state_path": state_path,
                      "state": state,
                  }
              )

          if not state_entries:
              raise SystemExit(
                  "FATAL: no successful F08 state artifacts found."
              )

          state_entries.sort(
              key=lambda item: item["run_id"]
          )

          baseline = state_entries[-1]
          baseline_run = baseline["run_id"]
          baseline_state = baseline["state"]

          baseline_ledger_path = (
              baseline["state_path"].parent /
              "phase2d_observations.jsonl"
          )

          if not baseline_ledger_path.exists():
              raise SystemExit(
                  f"FATAL: baseline Run #{baseline_run} is missing "
                  "phase2d_observations.jsonl."
              )

          print(
              f"Selected latest successful F08 baseline: "
              f"Run #{baseline_run}"
          )

          migration = (
              baseline_state
              .get("observation_ledger", {})
              .get("migration")
          )

          if not isinstance(migration, dict):
              raise SystemExit(
                  "FATAL: baseline state is missing "
                  "observation_ledger.migration."
              )

          initialization_events = [
              event
              for event in ledger.load_events(
                  baseline_ledger_path,
                  experiment_id=EXPERIMENT_ID,
              )
              if event.get("event")
              == reconciliation.MIGRATION_EVENT
          ]

          if not initialization_events:
              raise SystemExit(
                  "FATAL: baseline observation ledger does not contain "
                  "F08_LEDGER_INITIALIZED_FROM_STATE."
              )

          current_schema = migration.get(
              "legacy_state_schema"
          )

          if current_schema not in (5, 6):
              raise SystemExit(
                  "FATAL: unexpected baseline legacy_state_schema: "
                  f"{current_schema!r}"
              )

          # Preserve the untouched baseline before mutation.
          archive = (
              OUT /
              "pre_reconciliation_archive" /
              f"run_{baseline_run}"
          )
          archive.mkdir(
              parents=True,
              exist_ok=True,
          )

          for src_name in (
              "phase2d_state.json",
              "phase2d_results.json",
              "phase2d_latest_snapshot.json",
              "experiment_ledger.jsonl",
              "phase2d_observations.jsonl",
          ):
              src = baseline["state_path"].parent / src_name

              if not src.exists():
                  raise SystemExit(
                      f"FATAL: baseline is missing required artifact: {src_name}"
                  )

              shutil.copy2(
                  src,
                  archive / src_name,
              )

              shutil.copy2(
                  src,
                  OUT / src_name,
              )

          state_path = OUT / "phase2d_state.json"
          observation_path = OUT / "phase2d_observations.jsonl"

          historical_records, historical_summary = (
              reconciliation.collect_historical_resolved(
                  [
                      entry["state_path"]
                      for entry in state_entries
                  ],
                  experiment_id=EXPERIMENT_ID,
              )
          )

          # Independent audit of the successful F08 state snapshots established
          # the following recoverable historical union before this maintenance
          # workflow was implemented. Fail closed rather than silently accepting
          # an incomplete artifact set.
          # The original audit ended at Run #145 with
          # 542 candidate + 1676 production = 2218.
          # Subsequent successful F08 runs added 3 candidate and
          # 8 production observations. The missing-from-baseline
          # recovery remains 1169 (32 candidate + 1137 production).
          EXPECTED_HISTORICAL_COUNTS = {
              "candidate": 545,
              "production": 1684,
              "total": 2229,
          }

          historical_candidate = sum(
              1
              for result in historical_records
              if result.get("model") == "candidate"
          )

          historical_production = sum(
              1
              for result in historical_records
              if result.get("model") == "production"
          )

          historical_total = len(historical_records)

          if {
              "candidate": historical_candidate,
              "production": historical_production,
              "total": historical_total,
          } != EXPECTED_HISTORICAL_COUNTS:
              raise SystemExit(
                  "FATAL: historical F08 artifact coverage is incomplete "
                  "or unexpected. "
                  f"observed_candidate={historical_candidate}, "
                  f"observed_production={historical_production}, "
                  f"observed_total={historical_total}; "
                  f"expected={EXPECTED_HISTORICAL_COUNTS}"
              )

          existing_before = len(
              ledger.load_observations(
                  observation_path,
                  experiment_id=EXPERIMENT_ID,
              )
          )

          if existing_before > len(historical_records):
              raise SystemExit(
                  "FATAL: baseline ledger contains more observations "
                  "than the union of successful F08 state artifacts."
              )

          correction = (
              reconciliation.correct_migration_metadata(
                  baseline_state,
                  observation_path,
                  source_schema=5,
                  experiment_id=EXPERIMENT_ID,
              )
          )

          if not correction.get("corrected") and current_schema != 5:
              raise SystemExit(
                  "FATAL: migration provenance was not corrected."
              )

          reconciliation_result = (
              reconciliation.reconcile_ledger(
                  observation_path,
                  historical_records,
                  experiment_id=EXPERIMENT_ID,
              )
          )

          final_records = ledger.load_observations(
              observation_path,
              experiment_id=EXPERIMENT_ID,
          )

          final_counts = {
              "candidate": sum(
                  1
                  for record in final_records
                  if record.get("model") == "candidate"
              ),
              "production": sum(
                  1
                  for record in final_records
                  if record.get("model") == "production"
              ),
          }

          if (
              len(final_records)
              != len(historical_records)
          ):
              raise SystemExit(
                  "FATAL: final ledger count does not equal "
                  "historical F08 unique observation count."
              )

          expected_added = (
              len(historical_records)
              - existing_before
          )

          if reconciliation_result["added"] != expected_added:
              raise SystemExit(
                  "FATAL: reconciliation accounting mismatch: "
                  f"added={reconciliation_result['added']} "
                  f"expected={expected_added}"
              )

          if reconciliation_result["remaining_missing"] != 0:
              raise SystemExit(
                  "FATAL: reconciliation reports remaining missing "
                  "observations."
              )

          expected_recovered = 1169
          expected_candidate_recovered = 32
          expected_production_recovered = 1137

          if (
              reconciliation_result["added"]
              != expected_recovered
          ):
              raise SystemExit(
                  "FATAL: recovered observation count mismatch: "
                  f"observed={reconciliation_result['added']} "
                  f"expected={expected_recovered}"
              )

          if (
              reconciliation_result["added_by_model"]["candidate"]
              != expected_candidate_recovered
          ):
              raise SystemExit(
                  "FATAL: candidate historical recovery mismatch: "
                  f"observed={reconciliation_result['added_by_model']['candidate']} "
                  f"expected={expected_candidate_recovered}"
              )

          if (
              reconciliation_result["added_by_model"]["production"]
              != expected_production_recovered
          ):
              raise SystemExit(
                  "FATAL: production historical recovery mismatch: "
                  f"observed={reconciliation_result['added_by_model']['production']} "
                  f"expected={expected_production_recovered}"
              )

          # The validator source changed after Run #145 only to preserve
          # the original schema-5 provenance during the controlled F08
          # ledger migration. The repaired state remains schema 6, so its
          # locked validator identity must be refreshed explicitly rather
          # than relying on the schema-5 compatibility exception.
          import hashlib

          validator_path = Path(
              "phase2d_prospective_validator.py"
          )

          current_validator_hash = hashlib.sha256(
              validator_path.read_bytes()
          ).hexdigest()

          locked_models = baseline_state.get(
              "locked_models"
          )

          if not isinstance(locked_models, dict):
              raise SystemExit(
                  "FATAL: baseline state has no locked_models object."
              )

          previous_validator_hash = locked_models.get(
              "validator_code_hash"
          )

          definition = baseline_state.get(
              "experiment_definition"
          )

          if not isinstance(definition, dict):
              raise SystemExit(
                  "FATAL: baseline state has no experiment_definition object."
              )

          definition_identity = definition.get(
              "identity"
          )

          if not isinstance(definition_identity, dict):
              raise SystemExit(
                  "FATAL: baseline experiment_definition has no identity object."
              )

          locked_models["validator_code_hash"] = (
              current_validator_hash
          )

          definition_identity["validator_code_hash"] = (
              current_validator_hash
          )

          validator_identity_refresh = {
              "event": "F08_VALIDATOR_CODE_IDENTITY_REFRESHED",
              "previous_validator_code_hash": (
                  previous_validator_hash
              ),
              "current_validator_code_hash": (
                  current_validator_hash
              ),
              "reason": (
                  "Phase 2D validator code changed only for the "
                  "controlled F08 ledger provenance migration; "
                  "the repaired schema-6 state must carry the exact "
                  "validator identity used by subsequent normal runs."
              ),
          }

          ledger_path = OUT / "experiment_ledger.jsonl"

          with ledger_path.open(
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  json.dumps(
                      {
                          "event": (
                              "F08_VALIDATOR_CODE_IDENTITY_REFRESHED"
                          ),
                          "experiment_id": EXPERIMENT_ID,
                          "previous_validator_code_hash": (
                              previous_validator_hash
                          ),
                          "current_validator_code_hash": (
                              current_validator_hash
                          ),
                          "reason": (
                              "Phase 2D validator code changed only "
                              "for the controlled F08 ledger provenance "
                              "migration; repaired schema-6 state must "
                              "carry the current validator identity."
                          ),
                      },
                      sort_keys=True,
                  )
                  + "\n"
              )

          migration_metadata = baseline_state[
              "observation_ledger"
          ]["migration"]

          migration_metadata[
              "historical_reconciliation"
          ] = {
              "event": (
                  "F08_LEDGER_HISTORICAL_RECONCILIATION"
              ),
              "baseline_run_id": baseline_run,
              "historical_unique_observations": (
                  len(historical_records)
              ),
              "observations_recovered_from_historical_states": (
                  reconciliation_result["added"]
              ),
              "candidate_recovered": (
                  reconciliation_result[
                      "added_by_model"
                  ]["candidate"]
              ),
              "production_recovered": (
                  reconciliation_result[
                      "added_by_model"
                  ]["production"]
              ),
              "remaining_missing": (
                  reconciliation_result[
                      "remaining_missing"
                  ]
              ),
          }

          # The migration metadata correction is intentionally stored
          # in state and the immutable correction event is stored in
          # the observation ledger. Never rewrite historical event lines.
          state_path.write_text(
              json.dumps(
                  baseline_state,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          report = {
              "experiment_id": EXPERIMENT_ID,
              "baseline_run_id": baseline_run,
              "f08_state_runs": [
                  entry["run_id"]
                  for entry in state_entries
              ],
              "baseline_legacy_state_schema_before": current_schema,
              "baseline_legacy_state_schema_after": (
                  baseline_state
                  .get("observation_ledger", {})
                  .get("migration", {})
                  .get("legacy_state_schema")
              ),
              "historical_summary": historical_summary,
              "correction": correction,
              "reconciliation": reconciliation_result,
              "validator_identity_refresh": (
                  validator_identity_refresh
              ),
              "final_counts": final_counts,
              "final_ledger_count": len(final_records),
          }

          (OUT / "phase2d_f08_reconciliation_report.json").write_text(
              json.dumps(
                  report,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          manifest = {
              "experiment_id": EXPERIMENT_ID,
              "baseline_run_id": baseline_run,
              "state_runs_used": [
                  entry["run_id"]
                  for entry in state_entries
              ],
              "state_files_examined": len(
                  state_entries
              ),
          }

          (OUT / "phase2d_f08_reconciliation_manifest.json").write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          print()
          print("============================================================")
          print(" F08 HISTORICAL LEDGER RECONCILIATION COMPLETE")
          print("============================================================")
          print(f"Baseline run             : #{baseline_run}")
          print(
              "F08 state snapshots      : "
              f"{len(state_entries)}"
          )
          print(
              "Historical unique        : "
              f"{len(historical_records)}"
          )
          print(
              "Existing before          : "
              f"{existing_before}"
          )
          print(
              "Added                    : "
              f"{reconciliation_result['added']}"
          )
          print(
              "Candidate added          : "
              f"{reconciliation_result['added_by_model']['candidate']}"
          )
          print(
              "Production added         : "
              f"{reconciliation_result['added_by_model']['production']}"
          )
          print(
              "Final candidate ledger   : "
              f"{final_counts['candidate']}"
          )
          print(
              "Final production ledger  : "
              f"{final_counts['production']}"
          )
          print(
              "Final total              : "
              f"{len(final_records)}"
          )
          print(
              "Legacy schema corrected  : "
              f"{baseline_state['observation_ledger']['migration'].get('legacy_state_schema')}"
          )
          print(
              "Historical observations  : "
              f"{baseline_state['observation_ledger']['migration'].get('historical_reconciliation', {}).get('historical_unique_observations')}"
          )
          print(
              "Recovered from history  : "
              f"{baseline_state['observation_ledger']['migration'].get('historical_reconciliation', {}).get('observations_recovered_from_historical_states')}"
          )
          print("============================================================")
          PY

      # ============================================================
      # VERIFY IMMUTABILITY / ARTIFACT CONTENTS
      # ============================================================
      - name: Verify reconciled F08 state
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          import phase2d_observation_ledger as ledger

          state_path = Path(
              "research_outputs/phase2d_state.json"
          )
          observation_path = Path(
              "research_outputs/phase2d_observations.jsonl"
          )

          state = json.loads(
              state_path.read_text(
                  encoding="utf-8"
              )
          )

          experiment_id = (
              state["experiment_definition"]
              ["experiment_id"]
          )

          if experiment_id != "PHASE2D-HARDENED-20260924-F08":
              raise SystemExit(
                  "FATAL: reconciled state experiment ID mismatch."
              )

          migration = (
              state["observation_ledger"]
              ["migration"]
          )

          import hashlib

          current_validator_hash = hashlib.sha256(
              Path(
                  "phase2d_prospective_validator.py"
              ).read_bytes()
          ).hexdigest()

          if state["locked_models"].get(
              "validator_code_hash"
          ) != current_validator_hash:
              raise SystemExit(
                  "FATAL: reconciled state validator code hash "
                  "does not match the current validator."
              )

          if state["experiment_definition"]["identity"].get(
              "validator_code_hash"
          ) != current_validator_hash:
              raise SystemExit(
                  "FATAL: reconciled experiment definition validator "
                  "hash does not match the current validator."
              )

          if migration.get("legacy_state_schema") != 5:
              raise SystemExit(
                  "FATAL: reconciled state does not record "
                  "legacy source schema 5."
              )

          events = ledger.load_events(
              observation_path,
              experiment_id=experiment_id,
          )

          event_names = [
              event.get("event")
              for event in events
          ]

          if "F08_LEDGER_INITIALIZED_FROM_STATE" not in event_names:
              raise SystemExit(
                  "FATAL: initialization event missing."
              )

          if (
              "F08_LEDGER_MIGRATION_METADATA_CORRECTED"
              not in event_names
          ):
              raise SystemExit(
                  "FATAL: metadata-correction event missing."
              )

          if (
              "F08_LEDGER_HISTORICAL_RECONCILIATION"
              not in event_names
          ):
              raise SystemExit(
                  "FATAL: historical-reconciliation event missing."
              )

          observations = ledger.load_observations(
              observation_path,
              experiment_id=experiment_id,
          )

          if not observations:
              raise SystemExit(
                  "FATAL: reconciled observation ledger is empty."
              )

          print(
              f"Verified {len(observations)} immutable F08 observations."
          )
          print("Required immutable events: PASS")
          print("State experiment identity: PASS")
          print("Source schema provenance  : PASS")
          PY

      # ============================================================
      # UPLOAD RECONCILED STATE UNDER STANDARD RESTORE NAME
      # ============================================================
      - name: Upload reconciled Phase 2D state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-state
          path: |
            research_outputs/phase2d_state.json
            research_outputs/phase2d_results.json
            research_outputs/phase2d_latest_snapshot.json
            research_outputs/experiment_ledger.jsonl
            research_outputs/phase2d_observations.jsonl
            research_outputs/phase2d_f08_reconciliation_report.json
            research_outputs/phase2d_f08_reconciliation_manifest.json
            research_outputs/pre_reconciliation_archive/**
          if-no-files-found: error
          retention-days: 14
