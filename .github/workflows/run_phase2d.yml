name: CryptoBot AI — Phase 2D Prospective Validation

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "GitHub Actions run ID (leave blank to auto-detect latest candidate artifact)"
        required: false
        default: ""
        type: string
      production_release_tag:
        description: "Immutable production release tag to evaluate"
        required: false
        default: "v2.0"
        type: string

concurrency:
  group: cryptobot-phase2d
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.11"
  CANDIDATE_ARTIFACT_NAME: "htf-removal-candidate"
  CANDIDATE_MODEL_FILE: "candidate_model.pkl"
  PRODUCTION_MODEL_FILE: "pro_crypto_ai_model.pkl"
  STATE_ARTIFACT_NAME: "phase2d-state"
  STATE_DIR: "research_outputs"

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run context
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " CryptoBot AI — Phase 2D Prospective Validation"
          echo "============================================================"
          echo "Repository : ${GITHUB_REPOSITORY}"
          echo "Commit     : ${GITHUB_SHA}"
          echo "Run        : ${GITHUB_RUN_ID}"
          echo "Event      : ${GITHUB_EVENT_NAME}"
          echo "Candidate  : ${{ inputs.candidate_run_id || '(auto-resolve latest)' }}"
          echo "Production : ${{ inputs.production_release_tag }}"
          echo "Python     : ${PYTHON_VERSION}"
          echo "Schedule   : MANUAL ONLY"
          echo "============================================================"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          echo "Dependencies installed from requirements.txt."

      - name: Prepare Phase 2D workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STATE_DIR}" phase2d_candidate
          rm -f "${CANDIDATE_MODEL_FILE}" "${PRODUCTION_MODEL_FILE}"
          echo "Workspace ready."

      - name: Restore previous Phase 2D state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " STATE RESTORE"
          echo "============================================================"

          RUN_ID="$(
            gh run list \
              --workflow="run_phase2d.yml" \
              --limit 20 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "success") | .databaseId' \
              | head -n 1 || true
          )"

          if [[ -n "${RUN_ID}" ]]; then
            echo "Latest successful standalone Phase 2D run: ${RUN_ID}"
            rm -rf restored_phase2d_state
            mkdir -p restored_phase2d_state

            if gh run download "${RUN_ID}" \
                 -n "${STATE_ARTIFACT_NAME}" \
                 -D restored_phase2d_state; then
              restored=0
              for f in \
                phase2d_state.json \
                phase2d_results.json \
                phase2d_latest_snapshot.json
              do
                if [[ -f "restored_phase2d_state/${f}" ]]; then
                  cp "restored_phase2d_state/${f}" "${STATE_DIR}/${f}"
                  echo "Restored: ${f}"
                  restored=$((restored + 1))
                fi
              done
              echo "State files restored: ${restored}"
            else
              echo "No downloadable state artifact; starting fresh."
            fi
          else
            echo "No previous successful standalone Phase 2D state found; starting fresh."
          fi

      - name: Resolve and download candidate model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          INPUT_RUN_ID="${{ inputs.candidate_run_id }}"
          CANDIDATE_RUN_ID=""

          if [[ -n "${INPUT_RUN_ID}" ]]; then
            if ! [[ "${INPUT_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "FATAL: Supplied candidate_run_id must contain only digits: ${INPUT_RUN_ID}"
              exit 1
            fi
            echo "Using manually supplied candidate run ID: ${INPUT_RUN_ID}"
            CANDIDATE_RUN_ID="${INPUT_RUN_ID}"
          else
            echo "Candidate run ID not provided; auto-resolving latest run containing '${CANDIDATE_ARTIFACT_NAME}'..."
            CANDIDATE_RUN_ID="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                --paginate \
                --jq ".artifacts[] | select(.name == \"${CANDIDATE_ARTIFACT_NAME}\" and .expired == false) | .workflow_run.id" \
                | head -n 1 || true
            )"
          fi

          if [[ -z "${CANDIDATE_RUN_ID}" ]]; then
            echo "FATAL: Could not locate any valid candidate artifact named '${CANDIDATE_ARTIFACT_NAME}'."
            exit 1
          fi

          echo "Target candidate source run ID: ${CANDIDATE_RUN_ID}"
          gh run download "${CANDIDATE_RUN_ID}" \
            -n "${CANDIDATE_ARTIFACT_NAME}" \
            -D phase2d_candidate

          test -s "phase2d_candidate/${CANDIDATE_MODEL_FILE}"
          cp "phase2d_candidate/${CANDIDATE_MODEL_FILE}" "./${CANDIDATE_MODEL_FILE}"
          ls -lh "${CANDIDATE_MODEL_FILE}"

      - name: Verify locked candidate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = (
              "45064fddd32f2e23eb4c34ed56bcbe73a8a1bffc"
              "90b8b9b6d82fc3838c4308c2"
          )

          path = Path("candidate_model.pkl")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()

          print("candidate SHA256:", actual)
          print("candidate size:", path.stat().st_size, "bytes")

          if actual != expected:
              raise SystemExit(
                  "FATAL: candidate SHA does not match locked HTF-removal candidate"
              )
          PY

      - name: Inspect candidate model
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import joblib
          from pathlib import Path

          model = joblib.load(Path("candidate_model.pkl"))
          if not isinstance(model, dict):
              raise SystemExit("FATAL: unexpected candidate model type")

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }
          missing = required - set(model)
          if missing:
              raise SystemExit(
                  f"FATAL: candidate model missing keys: {sorted(missing)}"
              )

          declared = [str(x) for x in model["all_features"]]
          selected = [str(x) for x in model["best_features"]]

          print("candidate trained_at:", model.get("trained_at"))
          print("candidate declared features:", len(declared))
          print("candidate selected features:", len(selected))
          print("candidate selected feature list:", selected)

          missing_from_declared = [x for x in selected if x not in declared]
          if missing_from_declared:
              raise SystemExit(
                  "FATAL: candidate best_features contains undeclared features: "
                  f"{missing_from_declared}"
              )
          PY

      - name: Download locked production model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ inputs.production_release_tag }}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${PRODUCTION_MODEL_FILE}" \
            --dir . \
            --clobber

          test -s "${PRODUCTION_MODEL_FILE}"
          ls -lh "${PRODUCTION_MODEL_FILE}"

      - name: Verify locked production
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import joblib
          from pathlib import Path

          expected = (
              "f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"
          )

          path = Path("pro_crypto_ai_model.pkl")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()

          print("production SHA256:", actual)
          print("production size:", path.stat().st_size, "bytes")

          if actual != expected:
              raise SystemExit(
                  "FATAL: production SHA does not match locked production model"
              )

          model = joblib.load(path)
          if not isinstance(model, dict):
              raise SystemExit("FATAL: unexpected production model type")

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }
          missing = required - set(model)
          if missing:
              raise SystemExit(
                  f"FATAL: production model missing keys: {sorted(missing)}"
              )

          declared = [str(x) for x in model["all_features"]]
          selected = [str(x) for x in model["best_features"]]

          print("production trained_at:", model.get("trained_at"))
          print("production declared features:", len(declared))
          print("production selected features:", len(selected))
          print("production selected feature list:", selected)

          if len(declared) != 63:
              raise SystemExit(
                  f"FATAL: expected 63 production declared features, got {len(declared)}"
              )

          if len(selected) != 35:
              raise SystemExit(
                  f"FATAL: expected 35 production selected features, got {len(selected)}"
              )

          missing_from_declared = [x for x in selected if x not in declared]
          if missing_from_declared:
              raise SystemExit(
                  "FATAL: production best_features contains features not present "
                  f"in all_features: {missing_from_declared}"
              )
          PY

      - name: Validate Phase 2D source dependencies
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "phase2d_prospective_validator.py"
            "phase2d_promotion_gate.py"
            "feature_engineering.py"
            "market_data_integrity.py"
          )

          for f in "${required_files[@]}"; do
            test -s "${f}" || {
              echo "FATAL: missing required Phase 2D source file: ${f}"
              exit 1
            }
            echo "PASS: ${f}"
          done

          python -m py_compile \
            phase2d_prospective_validator.py \
            phase2d_promotion_gate.py \
            feature_engineering.py \
            market_data_integrity.py

      - name: Run Phase 2D validator
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PHASE 2D VALIDATOR — FULL LIVE LOG"
          echo "============================================================"

          python phase2d_prospective_validator.py 2>&1 | tee phase2d_validator.log

          echo
          echo "============================================================"
          echo " PHASE 2D VALIDATOR COMPLETE"
          echo "============================================================"

      - name: Print Phase 2D result summary
        if: always()
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo " PHASE 2D RESULT SUMMARY"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("research_outputs/phase2d_state.json"),
              Path("research_outputs/phase2d_results.json"),
              Path("research_outputs/phase2d_latest_snapshot.json"),
          ]

          for path in files:
              print()
              print(f"FILE: {path}")
              if not path.exists():
                  print("STATUS: MISSING")
                  continue

              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  print("STATUS: INVALID JSON:", exc)
                  continue

              print("STATUS: PRESENT")
              if isinstance(data, dict):
                  print("top-level keys:", sorted(data.keys()))

                  resolved = data.get("resolved")
                  pending = data.get("pending")
                  seen = data.get("seen")

                  if isinstance(resolved, dict):
                      for k, v in resolved.items():
                          if isinstance(v, list):
                              print(f"resolved.{k}: {len(v)}")
                  if isinstance(pending, dict):
                      for k, v in pending.items():
                          if isinstance(v, list):
                              print(f"pending.{k}: {len(v)}")
                  if isinstance(seen, dict):
                      for k, v in seen.items():
                          if isinstance(v, list):
                              print(f"seen.{k}: {len(v)}")

                  for key in (
                      "promotion_gate",
                      "candidate",
                      "production",
                      "summary",
                      "methodology",
                  ):
                      if key in data:
                          value = data[key]
                          if isinstance(value, dict):
                              print(f"{key}: dict_keys={sorted(value.keys())}")
                          elif isinstance(value, list):
                              print(f"{key}: list_length={len(value)}")
                          else:
                              print(f"{key}: {value}")
              else:
                  print("JSON type:", type(data).__name__)

          echo
          echo "Recent validator log:"
          tail -n 120 phase2d_validator.log 2>/dev/null || true

      - name: Write GitHub Actions summary
        if: always()
        shell: bash
        run: |
          set -u

          {
            echo "# CryptoBot AI — Phase 2D Prospective Validation"
            echo
            echo "- **Run:** ${GITHUB_RUN_ID}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Candidate source input:** ${{ inputs.candidate_run_id || '(auto-resolved)' }}"
            echo "- **Production release:** ${{ inputs.production_release_tag }}"
            echo "- **Cadence:** manual only"
            echo
            echo "## Artifacts"
            for f in \
              research_outputs/phase2d_state.json \
              research_outputs/phase2d_results.json \
              research_outputs/phase2d_latest_snapshot.json \
              phase2d_validator.log
            do
              if [[ -f "${f}" ]]; then
                echo "- \`${f}\`: present"
              else
                echo "- \`${f}\`: missing"
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Phase 2D research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-state
          path: |
            research_outputs/phase2d_state.json
            research_outputs/phase2d_results.json
            research_outputs/phase2d_latest_snapshot.json
            phase2d_validator.log
          if-no-files-found: error
          retention-days: 14
