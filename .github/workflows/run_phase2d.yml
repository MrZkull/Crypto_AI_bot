name: CryptoBot AI — Phase 2D Prospective Validation

on:
  workflow_dispatch:
    inputs:
      candidate_release_tag:
        description: "Candidate GitHub Release tag"
        required: true
        default: "phase2d-htf-removal-candidate-20260921"
        type: string

      production_release_tag:
        description: "Immutable production release tag to evaluate"
        required: false
        default: "v2.0"
        type: string

  # Disabled to eliminate dual-scheduler collisions.
  # Authoritative trigger handled externally via workflow_dispatch REST API every 2 hours.
  # schedule:
  #   - cron: "17 */2 * * *"

concurrency:
  group: cryptobot-phase2d
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.11"

  CANDIDATE_MODEL_FILE: "candidate_model.pkl"
  PRODUCTION_MODEL_FILE: "pro_crypto_ai_model.pkl"

  STATE_ARTIFACT_NAME: "phase2d-state"
  STATE_DIR: "research_outputs"

  # Locked Release defaults used by scheduled runs.
  CANDIDATE_RELEASE_TAG_DEFAULT: "phase2d-htf-removal-candidate-20260921"
  PRODUCTION_RELEASE_TAG_DEFAULT: "v2.0"

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # RUN CONTEXT
      # ============================================================
      - name: Run context
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_TAG="${{ inputs.candidate_release_tag || env.CANDIDATE_RELEASE_TAG_DEFAULT }}"
          PRODUCTION_TAG="${{ inputs.production_release_tag || env.PRODUCTION_RELEASE_TAG_DEFAULT }}"

          echo "============================================================"
          echo " CryptoBot AI — Phase 2D Prospective Validation"
          echo "============================================================"
          echo "Repository : ${GITHUB_REPOSITORY}"
          echo "Commit     : ${GITHUB_SHA}"
          echo "Run        : ${GITHUB_RUN_ID}"
          echo "Event      : ${GITHUB_EVENT_NAME}"
          echo "Candidate  : ${CANDIDATE_TAG}"
          echo "Production : ${PRODUCTION_TAG}"
          echo "Python     : ${PYTHON_VERSION}"
          echo "Cadence    : External Dispatch every 2 hours"
          echo "============================================================"

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          pip install -r requirements.txt

          echo "Dependencies installed from requirements.txt."

      # ============================================================
      # WORKSPACE
      # ============================================================
      - name: Prepare Phase 2D workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${STATE_DIR}" phase2d_candidate

          rm -f \
            "${CANDIDATE_MODEL_FILE}" \
            "${PRODUCTION_MODEL_FILE}"

          echo "Workspace ready."

      # ============================================================
      # RESTORE PREVIOUS STATE (COMPATIBILITY-AWARE SEARCH)
      # ============================================================
      - name: Restore previous Phase 2D state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " STATE RESTORE (COMPATIBILITY-AWARE)"
          echo "============================================================"

          EXPECTED_CAND_SHA="7213987874543e5d6e18b0bac32556647d40080b3e4222532e40a225a1bf08a3"
          EXPECTED_PROD_SHA="f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"

          RUN_IDS="$(
            gh run list \
              --workflow="run_phase2d.yml" \
              --branch main \
              --limit 20 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "success") | .databaseId'
          )"

          RESTORED_RUN_ID=""

          for rid in ${RUN_IDS}; do
            rm -rf inspect_state
            mkdir -p inspect_state

            if gh run download "${rid}" -n "${STATE_ARTIFACT_NAME}" -D inspect_state 2>/dev/null; then
              state_file="$(find inspect_state -type f -name "phase2d_state.json" -print -quit)"

              if [[ -n "${state_file}" && -f "${state_file}" ]]; then
                cand_sha="$(python -c "import json; d=json.load(open('${state_file}', encoding='utf-8')); print(d.get('locked_models', {}).get('candidate_sha256', ''))" 2>/dev/null || true)"
                prod_sha="$(python -c "import json; d=json.load(open('${state_file}', encoding='utf-8')); print(d.get('locked_models', {}).get('production_sha256', ''))" 2>/dev/null || true)"

                if [[ "${cand_sha}" == "${EXPECTED_CAND_SHA}" && "${prod_sha}" == "${EXPECTED_PROD_SHA}" ]]; then
                  echo "Found compatible state in Run #${rid}:"
                  echo " - candidate SHA: ${cand_sha:0:16}..."
                  echo " - production SHA: ${prod_sha:0:16}..."

                  restored=0
                  for f in \
                    phase2d_state.json \
                    phase2d_results.json \
                    phase2d_latest_snapshot.json
                  do
                    src="$(find inspect_state -type f -name "${f}" -print -quit)"
                    if [[ -n "${src}" ]]; then
                      cp "${src}" "${STATE_DIR}/${f}"
                      echo "Restored: ${f} from${src}"
                      restored=$((restored + 1))
                    fi
                  done

                  rm -rf inspect_state

                  if [[ "${restored}" -eq 3 ]]; then
                    RESTORED_RUN_ID="${rid}"
                    echo "State restore verification: PASS (all 3 files restored from Run #${rid})"
                    break
                  else
                    echo "Run #${rid} matched SHAs but was incomplete (${restored}/3 files). Checking older runs..."
                  fi
                else
                  echo "Skipping Run #${rid}: identity mismatch (cand=${cand_sha:0:8}..., prod=${prod_sha:0:8}...)"
                fi
              fi
            fi
            rm -rf inspect_state
          done

          if [[ -z "${RESTORED_RUN_ID}" ]]; then
            echo "No prior run found with compatible locked model SHAs; starting fresh initial state."
          fi

      # ============================================================
      # DOWNLOAD LOCKED CANDIDATE RELEASE
      # ============================================================
      - name: Download candidate Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_RELEASE_TAG="${{ inputs.candidate_release_tag || env.CANDIDATE_RELEASE_TAG_DEFAULT }}"

          if [[ -z "${CANDIDATE_RELEASE_TAG}" ]]; then
            echo "FATAL: candidate release tag is empty."
            exit 1
          fi

          echo "============================================================"
          echo " CANDIDATE RELEASE"
          echo "============================================================"
          echo "Release tag: ${CANDIDATE_RELEASE_TAG}"

          rm -rf phase2d_candidate
          mkdir -p phase2d_candidate

          gh release download "${CANDIDATE_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "candidate_model.pkl" \
            --dir phase2d_candidate \
            --clobber

          test -s "phase2d_candidate/${CANDIDATE_MODEL_FILE}"

          cp \
            "phase2d_candidate/${CANDIDATE_MODEL_FILE}" \
            "./${CANDIDATE_MODEL_FILE}"

          echo "Downloaded candidate Release asset:"
          ls -lh "${CANDIDATE_MODEL_FILE}"

      # ============================================================
      # VERIFY CANDIDATE SHA
      # ============================================================
      - name: Verify locked candidate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = "7213987874543e5d6e18b0bac32556647d40080b3e4222532e40a225a1bf08a3"
          path = Path("candidate_model.pkl")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()

          print("candidate SHA256:", actual)
          print("candidate size:", path.stat().st_size, "bytes")

          if actual != expected:
              raise SystemExit("FATAL: candidate SHA does not match locked HTF-removal candidate")
          PY

      # ============================================================
      # INSPECT CANDIDATE
      # ============================================================
      - name: Inspect candidate model
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import joblib
          from pathlib import Path

          model = joblib.load(Path("candidate_model.pkl"))

          if not isinstance(model, dict):
              raise SystemExit("FATAL: unexpected candidate model type")

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }

          missing = required - set(model)
          if missing:
              raise SystemExit(f"FATAL: candidate model missing keys: {sorted(missing)}")

          declared = [str(x) for x in model["all_features"]]
          selected = [str(x) for x in model["best_features"]]

          print("candidate trained_at:", model.get("trained_at"))
          print("candidate declared features:", len(declared))
          print("candidate selected features:", len(selected))
          print("candidate selected feature list:", selected)

          missing_from_declared = [x for x in selected if x not in declared]
          if missing_from_declared:
              raise SystemExit(f"FATAL: candidate best_features contains undeclared features: {missing_from_declared}")
          PY

      # ============================================================
      # DOWNLOAD LOCKED PRODUCTION RELEASE
      # ============================================================
      - name: Download locked production model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ inputs.production_release_tag || env.PRODUCTION_RELEASE_TAG_DEFAULT }}"

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "FATAL: production release tag is empty."
            exit 1
          fi

          echo "============================================================"
          echo " PRODUCTION RELEASE"
          echo "============================================================"
          echo "Release tag: ${RELEASE_TAG}"

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${PRODUCTION_MODEL_FILE}" \
            --dir . \
            --clobber

          test -s "${PRODUCTION_MODEL_FILE}"
          ls -lh "${PRODUCTION_MODEL_FILE}"

      # ============================================================
      # VERIFY PRODUCTION SHA + SCHEMA
      # ============================================================
      - name: Verify locked production
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import joblib
          from pathlib import Path

          expected = "f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"
          path = Path("pro_crypto_ai_model.pkl")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()

          print("production SHA256:", actual)
          print("production size:", path.stat().st_size, "bytes")

          if actual != expected:
              raise SystemExit("FATAL: production SHA does not match locked production model")

          model = joblib.load(path)
          if not isinstance(model, dict):
              raise SystemExit("FATAL: unexpected production model type")

          required = {
              "all_features",
              "selector",
              "ensemble",
              "label_map",
              "best_features",
          }

          missing = required - set(model)
          if missing:
              raise SystemExit(f"FATAL: production model missing keys: {sorted(missing)}")

          declared = [str(x) for x in model["all_features"]]
          selected = [str(x) for x in model["best_features"]]

          print("production trained_at:", model.get("trained_at"))
          print("production declared features:", len(declared))
          print("production selected features:", len(selected))
          print("production selected feature list:", selected)

          if len(declared) != 63:
              raise SystemExit(f"FATAL: expected 63 production declared features, got {len(declared)}")

          if len(selected) != 35:
              raise SystemExit(f"FATAL: expected 35 production selected features, got {len(selected)}")

          missing_from_declared = [x for x in selected if x not in declared]
          if missing_from_declared:
              raise SystemExit(f"FATAL: production best_features contains features not present in all_features: {missing_from_declared}")
          PY

      # ============================================================
      # VALIDATE SOURCE DEPENDENCIES
      # ============================================================
      - name: Validate Phase 2D source dependencies
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "phase2d_prospective_validator.py"
            "phase2d_promotion_gate.py"
            "feature_engineering.py"
            "market_data_integrity.py"
          )

          for f in "${required_files[@]}"; do
            test -s "${f}" || {
              echo "FATAL: missing required Phase 2D source file: ${f}"
              exit 1
            }
            echo "PASS: ${f}"
          done

          python -m py_compile \
            phase2d_prospective_validator.py \
            phase2d_promotion_gate.py \
            feature_engineering.py \
            market_data_integrity.py

      # ============================================================
      # RUN PROSPECTIVE VALIDATOR
      # ============================================================
      - name: Run Phase 2D validator
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PHASE 2D VALIDATOR — FULL LIVE LOG"
          echo "============================================================"

          python phase2d_prospective_validator.py \
            2>&1 | tee phase2d_validator.log

          echo
          echo "============================================================"
          echo " PHASE 2D VALIDATOR COMPLETE"
          echo "============================================================"

      # ============================================================
      # PRINT RESULT SUMMARY
      # ============================================================
      - name: Print Phase 2D result summary
        if: always()
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo " PHASE 2D RESULT SUMMARY"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("research_outputs/phase2d_state.json"),
              Path("research_outputs/phase2d_results.json"),
              Path("research_outputs/phase2d_latest_snapshot.json"),
          ]

          for path in files:
              print()
              print(f"FILE: {path}")

              if not path.exists():
                  print("STATUS: MISSING")
                  continue

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print("STATUS: INVALID JSON:", exc)
                  continue

              print("STATUS: PRESENT")

              if isinstance(data, dict):
                  print("top-level keys:", sorted(data.keys()))
                  resolved = data.get("resolved")
                  pending = data.get("pending")
                  seen = data.get("seen")

                  if isinstance(resolved, dict):
                      for k, v in resolved.items():
                          if isinstance(v, list):
                              print(f"resolved.{k}: {len(v)}")

                  if isinstance(pending, dict):
                      for k, v in pending.items():
                          if isinstance(v, list):
                              print(f"pending.{k}: {len(v)}")

                  if isinstance(seen, dict):
                      for k, v in seen.items():
                          if isinstance(v, list):
                              print(f"seen.{k}: {len(v)}")

                  for key in (
                      "promotion_gate",
                      "candidate",
                      "production",
                      "summary",
                      "methodology",
                  ):
                      if key not in data:
                          continue

                      value = data[key]
                      if isinstance(value, dict):
                          print(f"{key}: dict_keys={sorted(value.keys())}")
                      elif isinstance(value, list):
                          print(f"{key}: list_length={len(value)}")
                      else:
                          print(f"{key}: {value}")
              else:
                  print("JSON type:", type(data).__name__)
          PY

          echo
          echo "Recent validator log:"
          tail -n 120 phase2d_validator.log 2>/dev/null || true

      # ============================================================
      # GITHUB ACTIONS SUMMARY
      # ============================================================
      - name: Write GitHub Actions summary
        if: always()
        shell: bash
        run: |
          set -u

          CANDIDATE_TAG="${{ inputs.candidate_release_tag || env.CANDIDATE_RELEASE_TAG_DEFAULT }}"
          PRODUCTION_TAG="${{ inputs.production_release_tag || env.PRODUCTION_RELEASE_TAG_DEFAULT }}"

          {
            echo "# CryptoBot AI — Phase 2D Prospective Validation"
            echo
            echo "- **Run:** ${GITHUB_RUN_ID}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Event:** ${GITHUB_EVENT_NAME}"
            echo "- **Candidate release tag:** ${CANDIDATE_TAG}"
            echo "- **Production release:** ${PRODUCTION_TAG}"
            echo "- **Cadence:** External Dispatch every 2 hours"
            echo
            echo "## Locked model identities"
            echo
            echo "- **Candidate SHA:** 7213987874543e5d6e18b0bac32556647d40080b3e4222532e40a225a1bf08a3"
            echo "- **Production SHA:** f55b887c7f624179b3d9fee56d792c29424a589e3d8734edcd78ce1be71f2c21"
            echo
            echo "## Artifacts"

            for f in \
              research_outputs/phase2d_state.json \
              research_outputs/phase2d_results.json \
              research_outputs/phase2d_latest_snapshot.json \
              phase2d_validator.log
            do
              if [[ -f "${f}" ]]; then
                echo "- \`${f}\`: present"
              else
                echo "- \`${f}\`: missing"
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # UPLOAD PHASE 2D STATE
      # ============================================================
      - name: Upload Phase 2D research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-state
          path: |
            research_outputs/phase2d_state.json
            research_outputs/phase2d_results.json
            research_outputs/phase2d_latest_snapshot.json
            phase2d_validator.log
          if-no-files-found: error
          retention-days: 14
