name: CryptoBot AI — Run Phase 2B Feature Group Ablation

on:
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow fastparquet

      - name: Run Phase 2B Feature Group Ablation
        run: python phase2b_feature_group_ablation.py

      - name: Upload Phase 2B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-feature-group-ablation-results
          path: artifacts/
          if-no-files-found: error

