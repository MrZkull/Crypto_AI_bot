name: Dashboard Authentication Regression

on:
  pull_request:
    paths:
      - "dashboard.py"
      - "render.yaml"
      - "tests/test_dashboard_auth.py"
      - "docs/dashboard_security_rollout.md"
      - ".github/workflows/security-dashboard-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dashboard test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Flask>=2.3,<4" "python-dotenv>=1.0" "requests>=2.31" pytest

      - name: Compile dashboard
        run: python -m py_compile dashboard.py

      - name: Run authentication regression tests
        run: python -m pytest -q tests/test_dashboard_auth.py
