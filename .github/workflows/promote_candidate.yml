name: Evaluate & Promote Candidate Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Evaluates daily at 06:00 UTC

jobs:
  evaluate-gate-10:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyarrow fastparquet filelock pandas numpy scipy

      - name: Check For Active Candidate
        id: check_cand
        run: |
          if [ -f candidate_manifest.json ] && [ -f candidate_events.jsonl ]; then
            echo "active=true" >> $GITHUB_OUTPUT
          else
            echo "active=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No candidate or event ledger found — promotion check skipped."
          fi

      - name: Run Empirical Gate 10 Audit & Promotion
        if: steps.check_cand.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python promote_candidate.py

      - name: Publish Promoted Model to Production Release
        if: steps.check_cand.outputs.active == 'true' && hashFiles('promotion_record.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.0 pro_crypto_ai_model.pkl --clobber
          gh release upload v2.0 promotion_record.json --clobber
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidate_manifest.json promotion_record.json
          git commit -m "feat(release): promote candidate to v2.0 production [skip ci]" || true
          git push origin HEAD
          echo "🚀 Production release v2.0 updated with mathematically verified candidate."
