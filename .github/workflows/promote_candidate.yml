name: Promote Candidate to Production

on:
  schedule:
    - cron: '0 6 * * *'   # Checks daily at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger via GitHub Actions UI

concurrency:
  group: crypto-bot-promotion
  cancel-in-progress: false

jobs:
  promote-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install filelock pyarrow fastparquet xgboost scikit-learn

      - name: Run Empirical Gate 10 Promotion
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python promote_candidate.py

      - name: Commit Promotion Record
        run: |
          git config user.name "CryptoBot AI Admin"
          git config user.email "admin@cryptobot.ai"

          git add candidate_manifest.json promotion_record.json || true
          if git diff --cached --quiet; then
            echo "No promotion state changes to commit."
          else
            git commit -m "🚀 Promote candidate model to production [skip ci]"
            git pull origin main --rebase --autostash || true
            git push origin main || echo "Push skipped."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
