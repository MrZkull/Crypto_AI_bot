name: CryptoBot AI — Historical Auditor & Adaptation Engine

on:
  workflow_dispatch:

concurrency:
  group: crypto-bot-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-and-adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      - name: Init state files if missing
        run: |
          [ -f predictions.json ]          || echo '[]' > predictions.json
          [ -f coin_dossier.json ]         || echo '{}' > coin_dossier.json
          [ -f trade_history.json ]        || echo '[]' > trade_history.json
          [ -f adaptation_proposals.json ] || echo '[]' > adaptation_proposals.json
          mkdir -p data

      - name: Run Prediction Auditor
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " PREDICTION AUDITOR"
          echo "============================================================"
          python prediction_auditor.py 2>&1 | tee prediction_auditor.log

      - name: Run Failure Taxonomy
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " FAILURE TAXONOMY"
          echo "============================================================"
          python failure_taxonomy.py 2>&1 | tee failure_taxonomy.log

      - name: Print audit state summary
        if: always()
        run: |
          set -u
          echo "============================================================"
          echo " AUDIT STATE SUMMARY"
          echo "============================================================"
          python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ("predictions.json", []),
              ("coin_dossier.json", {}),
              ("trade_history.json", []),
              ("adaptation_proposals.json", []),
          ]

          for name, default in checks:
              p = Path(name)
              if not p.exists():
                  print(f"{name}: MISSING")
                  continue
              try:
                  data = json.loads(p.read_text())
              except Exception as exc:
                  print(f"{name}: INVALID JSON ({exc})")
                  continue
              if isinstance(data, dict):
                  print(f"{name}: dict_entries={len(data)}")
              elif isinstance(data, list):
                  print(f"{name}: list_entries={len(data)}")
              else:
                  print(f"{name}: type={type(data).__name__}")
          PY

          echo
          echo "Recent auditor log:"
          tail -n 80 prediction_auditor.log 2>/dev/null || true
          echo
          echo "Recent failure-taxonomy log:"
          tail -n 80 failure_taxonomy.log 2>/dev/null || true

      - name: Commit and Push Audit State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -f .env

          # ── 1. Backup fresh audit state to /tmp before git pull ──
          cp predictions.json          /tmp/predictions_runtime.json          2>/dev/null || echo '[]' > /tmp/predictions_runtime.json
          cp coin_dossier.json         /tmp/coin_dossier_runtime.json         2>/dev/null || echo '{}' > /tmp/coin_dossier_runtime.json
          cp trade_history.json        /tmp/trade_history_runtime.json        2>/dev/null || echo '[]' > /tmp/trade_history_runtime.json
          cp adaptation_proposals.json /tmp/adaptation_proposals_runtime.json 2>/dev/null || echo '[]' > /tmp/adaptation_proposals_runtime.json

          # ── 2. Pull remote changes cleanly ──
          git reset --hard HEAD
          git fetch origin main
          git pull --rebase origin main || git pull origin main || true

          # ── 3. Restore coin_dossier.json directly (Auditor is sole writer) ──
          cp /tmp/coin_dossier_runtime.json coin_dossier.json

          # ── 4. Symmetrical Multi-File Atomic Merge ──
          python -c "
          import json, shutil

          def load(path, default):
              try:
                  with open(path) as f: return json.load(f)
              except Exception: return default

          # -- predictions.json: Keyed by pred_id --
          try:
              local_preds  = {p['pred_id']: p for p in load('/tmp/predictions_runtime.json', [])}
              remote_preds = {p['pred_id']: p for p in load('predictions.json', [])}
              merged_preds = dict(local_preds)
              for pid, remote_p in remote_preds.items():
                  if pid not in merged_preds:
                      merged_preds[pid] = remote_p
                  else:
                      if remote_p.get('was_executed'):
                          merged_preds[pid]['was_executed'] = True
              with open('predictions.json', 'w') as f:
                  json.dump(list(merged_preds.values())[-10000:], f, indent=2)
          except Exception as e:
              print(f'Prediction merge warning: {e}')
              shutil.copyfile('/tmp/predictions_runtime.json', 'predictions.json')

          # -- trade_history.json: Keyed by composite trade tuple --
          def trade_key(t):
              return (t.get('symbol'), t.get('opened_at'), t.get('closed_at'), t.get('close_reason'))
          try:
              local_hist  = load('/tmp/trade_history_runtime.json', [])
              remote_hist = load('trade_history.json', [])
              merged_hist = {trade_key(t): t for t in local_hist}
              for t in remote_hist:
                  k = trade_key(t)
                  if k not in merged_hist:
                      merged_hist[k] = t
              with open('trade_history.json', 'w') as f:
                  json.dump(list(merged_hist.values()), f, indent=2)
          except Exception as e:
              print(f'Trade history merge warning: {e}')
              shutil.copyfile('/tmp/trade_history_runtime.json', 'trade_history.json')

          # -- adaptation_proposals.json: Remote approvals take precedence --
          try:
              local_props  = {p['id']: p for p in load('/tmp/adaptation_proposals_runtime.json', [])}
              remote_props = {p['id']: p for p in load('adaptation_proposals.json', [])}
              merged_props = dict(remote_props)
              for pid, p in local_props.items():
                  if pid not in merged_props:
                      merged_props[pid] = p
              with open('adaptation_proposals.json', 'w') as f:
                  json.dump(list(merged_props.values()), f, indent=2)
          except Exception as e:
              print(f'Proposals merge warning: {e}')
              shutil.copyfile('/tmp/adaptation_proposals_runtime.json', 'adaptation_proposals.json')
          "

          # ── 5. Stage, commit, and push ──
          git add predictions.json          || true
          git add coin_dossier.json         || true
          git add adaptation_proposals.json || true
          git add trade_history.json        || true
          # Do NOT persist the generic data/ directory from the audit runner.
          # Historical/raw data can be large and is not part of the audit state contract.
          echo "Audit persistence: data/ intentionally excluded from git commit."

          git diff --cached --quiet || git commit -m "Audit Predictions & Run Taxonomy [skip ci]"
          git push origin main

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ github.run_id }}
          path: |
            prediction_auditor.log
            failure_taxonomy.log
          if-no-files-found: warn
          retention-days: 7
