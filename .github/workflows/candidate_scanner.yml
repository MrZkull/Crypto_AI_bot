name: CryptoBot AI — Candidate Shadow Scanner

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes, isolated from live execution
  workflow_dispatch:

concurrency:
  group: crypto-bot-candidate-scanner
  cancel-in-progress: false

jobs:
  scan-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install filelock pyarrow fastparquet xgboost scikit-learn numpy pandas

      - name: Fetch Active Candidate Models from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view candidate-latest >/dev/null 2>&1; then
            echo "Fetching candidate model artifacts from candidate-latest release..."
            gh release download candidate-latest \
              --pattern "candidate_*.pkl" \
              --pattern "candidate_manifest.json" \
              --clobber || true
          else
            echo "No candidate-latest release found."
          fi

      - name: Monitor Existing Candidate Positions
        run: |
          set -euo pipefail
          if [ -f candidate_manifest.json ] && [ -f candidate_state.json ]; then
            python candidate_market_monitor.py
          fi

      - name: Scan New Candidate Setups
        run: |
          set -euo pipefail
          if [ -f candidate_model.pkl ] && [ -f candidate_manifest.json ]; then
            python candidate_scanner.py
          else
            echo "No active candidate model to scan."
          fi

      - name: Commit Shadow Event Ledger
        run: |
          git config user.name "CryptoBot AI Shadow"
          git config user.email "bot-shadow@cryptobot.ai"

          git add candidate_events.jsonl candidate_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No candidate state updates to commit."
          else
            git commit -m "chore(shadow): update candidate setups and outcomes [skip ci]"
            git pull origin main --rebase --autostash || true
            git push origin main || echo "Push skipped."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
