name: CryptoBot AI — Candidate Shadow Scanner

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes, isolated from live execution
  workflow_dispatch:

concurrency:
  group: crypto-bot-candidate-scanner
  cancel-in-progress: false

jobs:
  scan-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install filelock pyarrow fastparquet

      - name: Run Candidate Scanner
        run: |
          set -euo pipefail
          if [ -f candidate_model.pkl ] && [ -f candidate_manifest.json ]; then
            python candidate_scanner.py
          else
            echo "No active candidate model to scan."
          fi

      - name: Commit Shadow Event Ledger
        run: |
          git config user.name "CryptoBot AI Shadow"
          git config user.email "bot-shadow@cryptobot.ai"
          git add candidate_events.jsonl candidate_state.json || true
          if git diff --cached --quiet; then
            echo "No candidate state updates to commit."
          else
            git commit -m "chore(shadow): record candidate setup events [skip ci]"
            git pull origin main --rebase --autostash || true
            git push origin main || echo "Push skipped."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

