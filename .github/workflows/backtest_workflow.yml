name: Backtest Model

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many recent days to backtest'
        required: false
        default: '30'
      allow_historical:
        description: 'Allow historical data? (true = test recent holdout, false = strict post-training OOS)'
        type: boolean
        required: false
        default: true
      equity:
        description: 'Starting Equity in USD (e.g. 10.0 for ₹500 account, 100000 for institutional)'
        required: false
        default: '10.0'
      risk_per_trade:
        description: 'Risk Per Trade as Decimal (e.g. 0.03 for 3% / ₹15 risk, 0.01 for 1%)'
        required: false
        default: '0.03'
      max_open:
        description: 'Max Concurrent Open Trades (e.g. 2 for micro-capital, 10 for testnet)'
        required: false
        default: '2'
      tag:
        description: 'Label for this run (shows in the leaderboard)'
        required: false
        default: 'manual-check'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -q pandas numpy scikit-learn xgboost joblib requests ta

      - name: Download latest primary model
        run: |
          echo "Fetching primary model via GitHub CLI..."
          gh release download v2.0 --pattern "pro_crypto_ai_model.pkl" --clobber || \
          gh release download --pattern "pro_crypto_ai_model.pkl" --clobber || \
          (echo "Release download failed, checking local workspace..." && test -f pro_crypto_ai_model.pkl)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest meta model (if it exists)
        continue-on-error: true
        run: |
          echo "Fetching meta model (optional)..."
          gh release download v2.0 --pattern "meta_pipeline.pkl" --clobber || \
          gh release download --pattern "meta_pipeline.pkl" --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backtest — Primary model alone
        run: |
          echo "=== PRIMARY ONLY ==="
          HIST_FLAG=""
          if [ "${{ github.event.inputs.allow_historical }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HIST_FLAG="--allow-historical"
          fi
          
          python backtest.py \
            --days ${{ github.event.inputs.days || '30' }} \
            --equity ${{ github.event.inputs.equity || '10.0' }} \
            --risk-per-trade ${{ github.event.inputs.risk_per_trade || '0.03' }} \
            --max-open ${{ github.event.inputs.max_open || '2' }} \
            --tag "${{ github.event.inputs.tag || 'scheduled' }}-primary" \
            $HIST_FLAG

      - name: Backtest — Primary + Meta filter (if meta model exists)
        run: |
          if [ -f meta_pipeline.pkl ]; then
            echo "=== PRIMARY + META ==="
            HIST_FLAG=""
            if [ "${{ github.event.inputs.allow_historical }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              HIST_FLAG="--allow-historical"
            fi

            python backtest.py \
              --days ${{ github.event.inputs.days || '30' }} \
              --equity ${{ github.event.inputs.equity || '10.0' }} \
              --risk-per-trade ${{ github.event.inputs.risk_per_trade || '0.03' }} \
              --max-open ${{ github.event.inputs.max_open || '2' }} \
              --use-meta \
              --tag "${{ github.event.inputs.tag || 'scheduled' }}-meta" \
              $HIST_FLAG
          else
            echo "No meta_pipeline.pkl available — skipping meta comparison"
          fi

      - name: Commit backtest history
        run: |
          git config user.name  "CryptoBot AI"
          git config user.email "bot@cryptobot.ai"

          git add backtest_history.json backtest_results.json || true
          git commit -m "📊 Backtest run — $(date -u +%Y-%m-%d)" || echo "No changes to commit"

          git pull origin main --rebase --autostash
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            backtest_results.json
            backtest_history.json
          retention-days: 3
          if-no-files-found: ignore
