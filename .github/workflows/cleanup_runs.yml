name: Bulk Delete Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      runs_to_keep:
        description: 'Number of newest runs to KEEP (e.g. 1000)'
        required: true
        default: '1000'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Old Workflow Runs & Artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = parseInt('${{ github.event.inputs.runs_to_keep }}', 10);
            console.log(`Fetching all workflow runs...`);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            console.log(`Found ${runs.length} total workflow runs in repo.`);
            
            if (runs.length <= keep) {
              console.log(`Total runs (${runs.length}) is <= ${keep}. Nothing to delete.`);
              return;
            }

            const toDelete = runs.slice(keep);
            console.log(`Keeping latest ${keep} runs. Deleting ${toDelete.length} older workflow runs...`);

            // Process in parallel batches of 10 for much faster execution
            const BATCH_SIZE = 10;
            let deletedCount = 0;

            for (let i = 0; i < toDelete.length; i += BATCH_SIZE) {
              const batch = toDelete.slice(i, i + BATCH_SIZE);
              await Promise.all(
                batch.map(async (run) => {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                    });
                    deletedCount++;
                  } catch (err) {
                    console.warn(`Failed to delete run ID ${run.id}: ${err.message}`);
                  }
                })
              );

              if (deletedCount % 100 === 0 || i + BATCH_SIZE >= toDelete.length) {
                console.log(`Progress: Deleted ${deletedCount}/${toDelete.length} runs...`);
              }
            }
            console.log(`✅ Finished! Purged ${deletedCount} runs. Exactly ${keep} latest runs remain.`);
