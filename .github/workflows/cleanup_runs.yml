name: Bulk Delete Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      runs_to_keep:
        description: '1000'
        required: true
        default: '50'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Old Workflow Runs & Artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = parseInt('${{ github.event.inputs.runs_to_keep }}', 10);
            console.log(`Fetching all workflow runs...`);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            console.log(`Found ${runs.length} total workflow runs in repo.`);
            
            if (runs.length <= keep) {
              console.log(`Total runs (${runs.length}) <= keep threshold (${keep}). Nothing to delete.`);
              return;
            }

            const toDelete = runs.slice(keep);
            console.log(`Deleting ${toDelete.length} older workflow runs and their artifacts...`);

            let count = 0;
            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                count++;
                if (count % 50 === 0) {
                  console.log(`Progress: Deleted ${count}/${toDelete.length} runs...`);
                }
              } catch (err) {
                console.warn(`Could not delete run ID ${run.id}: ${err.message}`);
              }
            }
            console.log(`✅ Successfully purged ${count} old workflow runs & freed artifact storage!`);
