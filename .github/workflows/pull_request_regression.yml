name: Pull Request Regression Suite

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to test manually"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: pr-regression-${{ github.event.pull_request.number || github.event.inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Compile and full regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR merge commit or selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile core modules
        run: |
          python -m py_compile dashboard.py deribit_client.py trade_executor.py paper_execution.py

      - name: Run full regression suite
        run: python -m pytest -q
