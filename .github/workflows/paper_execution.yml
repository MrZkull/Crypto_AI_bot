name: CryptoBot AI — Stage 2E Paper Execution

on:
  # Production scanner runs at :04/:19/:34/:49. Stage 2E runs once per hour
  # at :09 UTC and consumes the persisted production prediction handoff.
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:

concurrency:
  group: cryptobot-stage2e-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Stage 2E paper execution
        run: python paper_execution_v2.py

      - name: Commit paper state and ledger
        run: |
          set -euo pipefail
          git config user.name "CryptoBot AI Paper"
          git config user.email "paper@cryptobot.ai"

          # Fail closed if the prospective baseline cannot be persisted.
          if [[ ! -s paper_state_v2.json ]]; then
            echo "::error::Stage 2E v2 did not write paper_state_v2.json"
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path("paper_state_v2.json").read_text(encoding="utf-8")
          )
          if not isinstance(state, dict):
              raise SystemExit("Stage 2E state is not a JSON object")
          if state.get("schema_version") != 2:
              raise SystemExit("Stage 2E state schema mismatch")
          if state.get("policy_version") != "stage2e-v2":
              raise SystemExit("Stage 2E state policy mismatch")
          if state.get("execution_mode") != "PAPER_ONLY":
              raise SystemExit("Stage 2E state execution mode mismatch")

          initialized = state.get("prospective_initialized_at_ms")
          baseline = state.get("prospective_start_time_ms")
          for name, value in (("initialized", initialized), ("baseline", baseline)):
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise SystemExit(f"Invalid {name} timestamp in Stage 2E state")
          if baseline <= initialized:
              raise SystemExit("Stage 2E prospective baseline is not after initialization")
          PY

          if [[ ! -f paper_events_v2.jsonl ]]; then
            : > paper_events_v2.jsonl
          fi

          # Force-add runtime state even if an ignore rule matches.
          git add -f paper_state_v2.json paper_events_v2.jsonl

          if git diff --cached --quiet; then
            echo "Stage 2E state/ledger are persisted and unchanged."
            exit 0
          fi

          git commit -m "chore(paper): update Stage 2E paper execution [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done

          echo "Unable to push Stage 2E paper state after 3 attempts."
          exit 1


