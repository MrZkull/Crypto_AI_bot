name: CryptoBot AI â€” Stage 2E Paper Execution

on:
  # Production scanner runs at :04/:19/:34/:49. The :09/:24/:39/:54
  # cadence gives the paper runner a short deterministic head-start window.
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

concurrency:
  group: cryptobot-stage2e-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Stage 2E paper execution
        run: python paper_execution.py

      - name: Commit paper state and ledger
        run: |
          set -euo pipefail
          git config user.name "CryptoBot AI Paper"
          git config user.email "paper@cryptobot.ai"

          git add paper_state.json paper_events.jsonl 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Stage 2E paper state changes."
            exit 0
          fi

          git commit -m "chore(paper): update Stage 2E paper execution [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done

          echo "Unable to push Stage 2E paper state after 3 attempts."
          exit 1

