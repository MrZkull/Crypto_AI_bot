name: CryptoBot AI — Primary Model Research Build

on:
  schedule:
    - cron: '0 2 1 * *'

  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retraining'
        required: false
        default: 'Manual retrain'
      train_meta:
        description: 'Run Meta-Model research pipeline?'
        required: false
        default: false
        type: boolean

concurrency:
  group: crypto-bot-model-training
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------
      # 1. Source/module presence
      # ---------------------------------------------------------------
      - name: Verify canonical research code
        run: |
          set -euo pipefail

          required_files=(
            "train_model.py"
            "download_training_data.py"
            "market_data_integrity.py"
            "feature_engineering.py"
            "research/audit_archive_cadence.py"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error::Missing required file: $file"
              exit 1
            }
          done

      # ---------------------------------------------------------------
      # 2. Build canonical archive
      # ---------------------------------------------------------------
      - name: Populate canonical historical archive
        run: |
          set -euo pipefail

          echo "Building canonical historical archive..."
          python download_training_data.py

          test -d data/historical || {
            echo "::error::Archive builder did not create data/historical"
            exit 1
          }

      # ---------------------------------------------------------------
      # 3. Verify exact expected file set
      # ---------------------------------------------------------------
      - name: Verify canonical archive presence
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from config import SYMBOLS

          root = Path("data/historical")

          if not root.is_dir():
              raise SystemExit(
                  "CRITICAL: data/historical does not exist"
              )

          missing = []

          for symbol in SYMBOLS:
              for interval in ("15m", "1h", "4h"):
                  path = root / f"{symbol}_{interval}.parquet"

                  if not path.is_file():
                      missing.append(str(path))

          # BTC 15m benchmark is required by train_model.py.
          btc = root / "BTCUSDT_15m.parquet"

          if not btc.is_file():
              missing.append(str(btc))

          if missing:
              print("Missing canonical archive files:")

              for path in missing:
                  print(f"  - {path}")

              raise SystemExit(
                  f"CRITICAL: {len(missing)} canonical archive files missing."
              )

          expected = len(SYMBOLS) * 3
          if "BTCUSDT" not in SYMBOLS:
              expected += 1

          print(
              f"Canonical archive presence check: PASS "
              f"({expected} files)"
          )
          PY

      # ---------------------------------------------------------------
      # 4. Canonical zero-repair integrity gate
      # ---------------------------------------------------------------
      - name: Run archive integrity gate
        run: |
          set -euo pipefail
          python research/audit_archive_cadence.py

      # ---------------------------------------------------------------
      # 5. Compile research/training sources
      # ---------------------------------------------------------------
      - name: Compile research and training sources
        run: |
          set -euo pipefail

          python -m py_compile \
            train_model.py \
            download_training_data.py \
            market_data_integrity.py \
            feature_engineering.py

      # ---------------------------------------------------------------
      # 6. Clean candidate outputs
      # ---------------------------------------------------------------
      - name: Clean stale candidate artifacts
        run: |
          rm -f pro_crypto_ai_model.pkl
          rm -f model_performance.json
          rm -f accuracy.txt
          rm -f meta_pipeline.pkl
          rm -f meta_model_performance.json

      # ---------------------------------------------------------------
      # 7. Primary training
      # ---------------------------------------------------------------
      - name: Run primary model training
        env:
          RETRAIN_NOTE: ${{ inputs.note || 'Scheduled monthly retrain' }}
        run: |
          echo "Starting primary training at $(date -u)"
          echo "Reason: ${RETRAIN_NOTE}"

          python train_model.py

          echo "Primary training completed at $(date -u)"

      # ---------------------------------------------------------------
      # 8. Fresh-artifact check
      # ---------------------------------------------------------------
      - name: Verify fresh primary outputs
        run: |
          set -euo pipefail

          test -s pro_crypto_ai_model.pkl || {
            echo "::error::pro_crypto_ai_model.pkl was not produced."
            exit 1
          }

          test -s model_performance.json || {
            echo "::error::model_performance.json was not produced."
            exit 1
          }

      # ---------------------------------------------------------------
      # 9. Artifact structure validation
      # ---------------------------------------------------------------
      - name: Validate primary model artifact
        run: |
          python - <<'PY'
          import json
          import joblib

          with open("model_performance.json") as f:
              performance = json.load(f)

          pipeline = joblib.load("pro_crypto_ai_model.pkl")

          required_keys = {
              "ensemble",
              "selector",
              "all_features",
              "best_features",
              "label_map",
              "label_encoder",
              "recommended_threshold_buy",
              "recommended_threshold_sell",
          }

          missing = required_keys - set(pipeline)

          if missing:
              raise SystemExit(
                  f"CRITICAL: model artifact missing keys: {sorted(missing)}"
              )

          required_metrics = (
              "buy_precision",
              "sell_precision",
              "n_train",
              "n_calib",
              "n_test",
          )

          missing_metrics = [
              field
              for field in required_metrics
              if field not in performance
          ]

          if missing_metrics:
              raise SystemExit(
                  f"CRITICAL: model_performance.json missing: "
                  f"{missing_metrics}"
              )

          print("Primary model artifact validation: PASS")
          print(f"Accuracy:       {performance.get('accuracy', 0)}%")
          print(f"WF mean:        {performance.get('wf_mean', 0)}%")
          print(f"Train samples:  {performance.get('n_train', 0)}")
          print(f"Calibration:    {performance.get('n_calib', 0)}")
          print(f"Test samples:   {performance.get('n_test', 0)}")
          print(f"BUY precision:  {performance.get('buy_precision', 0)}")
          print(f"SELL precision: {performance.get('sell_precision', 0)}")
          PY

      # ---------------------------------------------------------------
      # 10. Optional meta research
      # ---------------------------------------------------------------
      - name: Run meta-model research pipeline
        if: ${{ inputs.train_meta }}
        run: |
          echo "Starting meta-model research pipeline..."
          python train_meta_model.py
          echo "Meta-model research pipeline completed."

      - name: Verify meta-model research outputs
        if: ${{ inputs.train_meta }}
        run: |
          test -s meta_pipeline.pkl || {
            echo "::error::Meta model requested but meta_pipeline.pkl missing."
            exit 1
          }

          test -s meta_model_performance.json || {
            echo "::error::Meta model requested but performance file missing."
            exit 1
          }

      # ---------------------------------------------------------------
      # 11. Commit metrics ONLY
      # ---------------------------------------------------------------
      - name: Commit research metrics only
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add model_performance.json

          if [ -f accuracy.txt ]; then
            git add accuracy.txt
          fi

          if [ -f meta_model_performance.json ]; then
            git add meta_model_performance.json
          fi

          if git diff --cached --quiet; then
            echo "No research metric changes to commit."
          else
            git commit \
              -m "Research model retrain metrics [skip ci]"

            git fetch origin main

            git rebase origin/main

            git push origin main
          fi

      # ---------------------------------------------------------------
      # 12. Candidate artifacts
      # ---------------------------------------------------------------
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primary-model-candidate-${{ github.run_number }}
          path: |
            pro_crypto_ai_model.pkl
            model_performance.json
            accuracy.txt
            meta_pipeline.pkl
            meta_model_performance.json
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------
      # 13. Explicitly prevent legacy promotion
      # ---------------------------------------------------------------
      - name: Research build complete — no production promotion
        run: |
          echo "============================================================"
          echo "PRIMARY MODEL RESEARCH BUILD COMPLETE"
          echo "============================================================"
          echo "Candidate artifact was generated and validated."
          echo "This workflow does NOT modify the production release."
          echo "Production promotion is handled only by:"
          echo "  model_build_release.yml"
          echo "============================================================"
