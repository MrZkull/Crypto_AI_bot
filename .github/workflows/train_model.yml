name: CryptoBot AI — Train Primary Model Research Build

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retraining'
        required: false
        default: 'Manual retrain'
      train_meta:
        description: 'Run Meta-Model research pipeline?'
        required: false
        default: false
        type: boolean

concurrency:
  group: crypto-bot-model-training
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify canonical research inputs
        run: |
          test -f train_model.py
          test -f market_data_integrity.py
          test -f research/audit_archive_cadence.py
          test -d data/historical

      - name: Run archive integrity gate
        run: |
          python research/audit_archive_cadence.py

      - name: Compile training sources
        run: |
          python -m py_compile \
            train_model.py \
            market_data_integrity.py \
            feature_engineering.py

      - name: Clean stale candidate artifacts
        run: |
          rm -f pro_crypto_ai_model.pkl
          rm -f model_performance.json accuracy.txt
          rm -f meta_pipeline.pkl meta_model_performance.json

      - name: Run primary model training
        env:
          RETRAIN_NOTE: ${{ inputs.note || 'Scheduled monthly retrain' }}
        run: |
          echo "Starting primary model training at $(date -u)"
          echo "Reason: ${RETRAIN_NOTE}"
          python train_model.py
          echo "Primary training complete at $(date -u)"

      - name: Verify fresh primary outputs
        run: |
          test -s pro_crypto_ai_model.pkl || {
            echo "::error::Primary model artifact was not produced."
            exit 1
          }
          test -s model_performance.json || {
            echo "::error::Primary model performance file was not produced."
            exit 1
          }

      - name: Validate primary model artifact
        run: |
          python - <<'PY'
          import json
          import joblib

          with open("model_performance.json") as f:
              performance = json.load(f)

          pipeline = joblib.load("pro_crypto_ai_model.pkl")
          required = {"ensemble", "selector", "all_features", "label_map"}
          missing = required - set(pipeline)
          if missing:
              raise SystemExit(
                  f"CRITICAL: primary model artifact missing keys: {sorted(missing)}"
              )

          print("Primary artifact structure: PASS")
          print(f"Accuracy: {performance.get('accuracy', 0)}%")
          print(f"WF score: {performance.get('wf_mean', 0)}%")
          print(f"Train samples: {performance.get('n_train', 0)}")
          print(f"Test samples: {performance.get('n_test', 0)}")
          PY

      - name: Write accuracy note
        run: |
          python - <<'PY'
          import json
          p = json.load(open("model_performance.json"))
          with open("accuracy.txt", "w") as f:
              f.write(f"{p.get('accuracy', 0)}% accuracy")
          PY

      - name: Run meta-model research pipeline
        if: ${{ inputs.train_meta }}
        run: |
          echo "Starting meta-model research pipeline at $(date -u)"
          python train_meta_model.py
          echo "Meta-model research complete at $(date -u)"

      - name: Verify meta-model research outputs
        if: ${{ inputs.train_meta }}
        run: |
          test -s meta_pipeline.pkl || {
            echo "::error::Meta-model requested but meta_pipeline.pkl was not produced."
            exit 1
          }
          test -s meta_model_performance.json || {
            echo "::error::Meta-model requested but meta_model_performance.json was not produced."
            exit 1
          }

      - name: Show training results
        run: |
          python - <<'PY'
          import json
          with open("model_performance.json") as f:
              p = json.load(f)
          print("=" * 60)
          print(f"ACCURACY:        {p.get('accuracy', 0)}%")
          print(f"WF SCORE:        {p.get('wf_mean', 0)}% +/- {p.get('wf_std', 0)}%")
          print(f"TRAIN SET:       {p.get('n_train', 0)}")
          print(f"TEST SET:        {p.get('n_test', 0)}")
          print(f"BUY PRECISION:   {p.get('buy_precision', 0)}")
          print(f"SELL PRECISION:  {p.get('sell_precision', 0)}")
          print(f"NO-TRADE PREC.:  {p.get('no_trade_precision', 0)}")
          print("=" * 60)
          PY

      - name: Show meta research results
        if: ${{ inputs.train_meta && hashFiles('meta_model_performance.json') != '' }}
        run: |
          python - <<'PY'
          import json
          p = json.load(open("meta_model_performance.json"))
          print("=" * 60)
          print(f"EVALUATION MODE: {p.get('evaluation_mode', 'UNKNOWN')}")
          print(f"RESEARCH PASS:   {p.get('passed_research_gate', False)}")
          print(f"PRODUCTION PASS: {p.get('passed_production_gate', False)}")
          print(f"META RETAINED:  {p.get('n_meta_retained', 0)}")
          print(f"META MEAN NET-R: {p.get('meta_mean_net_r', 0)}")
          print(f"R LIFT:          {p.get('r_lift', 0)}")
          print("Research result is not a production release authorization.")
          print("=" * 60)
          PY

      - name: Commit research metrics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add model_performance.json accuracy.txt
          if [ -f meta_model_performance.json ]; then
            git add meta_model_performance.json
          fi

          git diff --cached --quiet || git commit -m "Research model retrain metrics [skip ci]"

          git fetch origin main
          git rebase origin/main || {
            echo "Rebase failed; aborting rather than overwriting remote state."
            git rebase --abort || true
            exit 1
          }

          git push origin main

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primary-model-candidate-${{ github.run_number }}
          path: |
            pro_crypto_ai_model.pkl
            model_performance.json
            accuracy.txt
            meta_pipeline.pkl
            meta_model_performance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explicit promotion status
        run: |
          echo "Candidate model build completed."
          echo "No live release was modified by this workflow."
          echo "Production promotion is handled only by the controlled model release workflow after empirical Gate 10 approval."
