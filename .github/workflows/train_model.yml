name: Train ML Model

on:
  schedule:
    - cron: '0 2 1 * *'    # Runs at 02:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retraining (optional note)'
        required: false
        default: 'Manual retrain'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q pandas numpy scikit-learn xgboost joblib requests ta

      - name: Purge old workspace state
        run: |
          rm -f pro_crypto_ai_model.pkl model_performance.json meta_pipeline.pkl meta_model_performance.json accuracy.txt

      - name: Run training (Phase 3.6)
        run: |
          echo "Starting model training at $(date -u)"
          echo "Note: ${{ github.event.inputs.note }}"
          python train_model.py
          echo "Training complete at $(date -u)"

      - name: Extract metrics to plain text (Fixes shell quoting fragility)
        run: |
          python -c "
          import json
          with open('model_performance.json') as f:
              p = json.load(f)
          with open('accuracy.txt', 'w') as out:
              out.write(f\"{p.get('accuracy', 0)}% accuracy (BUY Prec: {p.get('buy_precision', 0)*100:.1f}%, SELL Prec: {p.get('sell_precision', 0)*100:.1f}%)\")
          "

      - name: Production Promotion Gate (Safety Floor Check)
        run: |
          python -c "
          import json, sys
          with open('model_performance.json') as f:
              p = json.load(f)
          
          buy_prec = p.get('buy_precision', 0)
          sell_prec = p.get('sell_precision', 0)
          
          print(f'Evaluating Promotion Gate -> BUY Prec: {buy_prec*100:.1f}% | SELL Prec: {sell_prec*100:.1f}%')
          
          # Hard safety floor: Reject if either directional precision falls below 40%
          if buy_prec < 0.40 or sell_prec < 0.40:
              print('🚨 PROMOTION GATE FAILED: Directional precision breached 40% safety floor!')
              sys.exit(1)
          print('✅ PROMOTION GATE PASSED: Model clears live capital safety thresholds.')
          "

      - name: Show training results
        run: |
          echo "=================================================="
          cat accuracy.txt
          echo "=================================================="

      - name: Commit Performance Metrics & Model
        run: |
          git config user.name  "CryptoBot AI"
          git config user.email "bot@cryptobot.ai"

          git add model_performance.json pro_crypto_ai_model.pkl || true
          git commit -m "🤖 Retrain model — $(cat accuracy.txt)" || echo "No changes to commit"

          git pull origin main --rebase --autostash
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Verified Model to GitHub Release v2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Safe overwrite only after passing the promotion gate
          gh release upload v2.0 pro_crypto_ai_model.pkl model_performance.json --clobber
          echo "Successfully published validated model and performance metrics to v2.0 Release!"
