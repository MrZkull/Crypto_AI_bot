name: Train & Build Candidate Model

on:
  schedule:
    - cron: '0 2 1 * *'   # Runs at 02:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retraining'
        required: false
        default: 'Manual retrain'
      train_meta:
        description: 'Run Meta-Model research pipeline?'
        required: false
        default: true
        type: boolean

concurrency:
  group: crypto-bot-model-training
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyarrow fastparquet filelock websockets pytest
          python -c "import pyarrow; print('✓ PyArrow verified:', pyarrow.__version__)"

      - name: Verify source modules exist
        run: |
          set -euo pipefail
          test -f train_model.py || { echo "::error::Missing train_model.py"; exit 1; }
          test -f execution_policy.py || { echo "::error::Missing execution_policy.py"; exit 1; }
          test -f gate10.py || { echo "::error::Missing gate10.py"; exit 1; }
          test -f download_training_data.py || { echo "::error::Missing download_training_data.py"; exit 1; }
          test -f market_data_integrity.py || { echo "::error::Missing market_data_integrity.py"; exit 1; }
          test -f feature_engineering.py || { echo "::error::Missing feature_engineering.py"; exit 1; }

      - name: Populate canonical historical archive
        run: |
          set -euo pipefail
          python download_training_data.py
          test -d data/historical || { echo "::error::Archive downloader failed to create data/historical"; exit 1; }

      - name: Run archive cadence & integrity gate
        run: |
          set -euo pipefail
          python research/audit_archive_cadence.py

      - name: Run deterministic funding tests
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest tests/test_funding.py -v

      - name: Clean stale candidate artifacts
        run: |
          rm -f candidate_model.pkl candidate_meta_model.pkl candidate_manifest.json
          rm -f model_performance.json meta_model_performance.json

      - name: Run primary model training
        run: |
          echo "Starting candidate model training at $(date -u)"
          python train_model.py

      - name: Train Meta Model (Research Pipeline)
        if: ${{ github.event.inputs.train_meta == 'true' || github.event_name == 'schedule' }}
        run: |
          echo "Starting meta-model candidate training at $(date -u)"
          python train_meta_model.py

      - name: Verify candidate outputs
        run: |
          test -s candidate_model.pkl || { echo "::error::candidate_model.pkl was not produced"; exit 1; }
          test -s candidate_manifest.json || { echo "::error::candidate_manifest.json was not produced"; exit 1; }

      - name: Commit Performance Metrics ONLY
        run: |
          git config user.name  "CryptoBot AI"
          git config user.email "bot@cryptobot.ai"

          git add model_performance.json || true
          [ -f meta_model_performance.json ] && git add meta_model_performance.json || true
          [ -f candidate_manifest.json ] && git add candidate_manifest.json || true

          if git diff --cached --quiet; then
            echo "No performance metric changes to commit."
          else
            git commit -m "🤖 Freeze candidate model metrics [skip ci]"
            git pull origin main --rebase --autostash || true
            git push origin main || echo "Git push skipped."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Candidate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate-build-${{ github.run_number }}
          path: |
            candidate_model.pkl
            candidate_meta_model.pkl
            candidate_manifest.json
            model_performance.json
            meta_model_performance.json
          if-no-files-found: error
          retention-days: 30

      - name: Log Immutable Candidate Status
        run: |
          echo "✅ Candidate successfully frozen and awaits prospective execution."
          echo "Run promote_candidate.py on your execution server to evaluate empirical Gate 10."
