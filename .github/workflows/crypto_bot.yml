name: CryptoBot AI — Trading Scanner

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  repository_dispatch: {}

concurrency:
  group: crypto-bot-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Download 230 MB model artifact from GitHub Release v2.0 ──
      - name: Download Model Artifact from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          if [ ! -f pro_crypto_ai_model.pkl ]; then
            echo "Fetching pro_crypto_ai_model.pkl from Release v2.0..."
            gh release download v2.0 --pattern "pro_crypto_ai_model.pkl" --clobber --repo "${{ github.repository }}"
          fi

      - name: Init state files if missing
        run: |
          [ -f trades.json ]            || echo '{}' > trades.json
          [ -f trade_history.json ]      || echo '[]' > trade_history.json
          [ -f signals.json ]            || echo '[]' > signals.json
          [ -f scan_mode.json ]          || echo '{"mode":"active"}' > scan_mode.json
          [ -f balance.json ]            || echo '{"usdt":0,"equity":0,"unrealised":0,"assets":[]}' > balance.json
          [ -f orphan_candidates.json ]  || echo '{}' > orphan_candidates.json
          [ -f scan_status.json ]        || echo '{"phase":"idle"}' > scan_status.json
          [ -f predictions.json ]        || echo '[]' > predictions.json
          [ -f reliability.json ]        || echo '{}' > reliability.json
          [ -f cooldown.json ]           || echo '{}' > cooldown.json
          mkdir -p data

      - name: Run Trading Scanner
        env:
          DERIBIT_CLIENT_ID: ${{ secrets.DERIBIT_CLIENT_ID }}
          DERIBIT_CLIENT_SECRET: ${{ secrets.DERIBIT_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python trade_executor.py

      - name: Commit and Push State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -f .env

          # ── 1. Backup runtime files to /tmp ──
          cp trades.json            /tmp/trades_runtime.json            2>/dev/null || echo '{}' > /tmp/trades_runtime.json
          cp trade_history.json     /tmp/trade_history_runtime.json     2>/dev/null || echo '[]' > /tmp/trade_history_runtime.json
          cp signals.json           /tmp/signals_runtime.json           2>/dev/null || echo '[]' > /tmp/signals_runtime.json
          cp scan_mode.json         /tmp/scan_mode_runtime.json         2>/dev/null || echo '{}' > /tmp/scan_mode_runtime.json
          cp balance.json           /tmp/balance_runtime.json           2>/dev/null || echo '{}' > /tmp/balance_runtime.json
          cp orphan_candidates.json /tmp/orphan_runtime.json            2>/dev/null || echo '{}' > /tmp/orphan_runtime.json
          cp scan_status.json       /tmp/scan_status_runtime.json       2>/dev/null || echo '{}' > /tmp/scan_status_runtime.json
          cp predictions.json       /tmp/predictions_runtime.json       2>/dev/null || echo '[]' > /tmp/predictions_runtime.json
          cp reliability.json       /tmp/reliability_runtime.json       2>/dev/null || echo '{}' > /tmp/reliability_runtime.json
          cp cooldown.json          /tmp/cooldown_runtime.json          2>/dev/null || echo '{}' > /tmp/cooldown_runtime.json

          # ── 2. Clean tree and pull remote main cleanly ──
          git reset --hard HEAD
          git fetch origin main
          git pull --rebase origin main || git pull origin main || true

          # ── 3. Restore files owned exclusively by scanner ──
          cp /tmp/trades_runtime.json            trades.json
          cp /tmp/trade_history_runtime.json     trade_history.json
          cp /tmp/signals_runtime.json           signals.json
          cp /tmp/scan_mode_runtime.json         scan_mode.json
          cp /tmp/balance_runtime.json           balance.json
          cp /tmp/orphan_runtime.json            orphan_candidates.json
          cp /tmp/scan_status_runtime.json       scan_status.json
          cp /tmp/reliability_runtime.json       reliability.json
          cp /tmp/cooldown_runtime.json          cooldown.json

          # ── 4. Atomic prediction merge ──
          python -c "
          import json, shutil
          try:
              with open('/tmp/predictions_runtime.json') as f:
                  local_preds = {p['pred_id']: p for p in json.load(f)}
              with open('predictions.json') as f:
                  remote_preds = {p['pred_id']: p for p in json.load(f)}
              merged = remote_preds.copy()
              for pid, local_p in local_preds.items():
                  if pid in merged and merged[pid].get('audited'):
                      if local_p.get('was_executed'):
                          merged[pid]['was_executed'] = True
                  else:
                      merged[pid] = local_p
              with open('predictions.json', 'w') as f:
                  json.dump(list(merged.values())[-10000:], f, indent=2)
          except Exception as e:
              print(f'Prediction merge warning: {e}')
              shutil.copyfile('/tmp/predictions_runtime.json', 'predictions.json')
          "

          # ── 5. Stage, commit, and push ──
          git add trades.json            || true
          git add trade_history.json     || true
          git add signals.json           || true
          git add scan_mode.json         || true
          git add balance.json           || true
          git add orphan_candidates.json || true
          git add scan_status.json       || true
          git add predictions.json       || true
          git add reliability.json       || true
          git add cooldown.json          || true
          git add data/                  || true

          git diff --cached --quiet || git commit -m "Update Bot State & Sync Predictions [skip ci]"
          git push origin main
