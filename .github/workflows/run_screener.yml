name: Run Coin Screener

on:
  workflow_dispatch:
    inputs:
      min_volume:
        description: 'Minimum 24h Binance Volume in USD (Default: $2,000,000)'
        required: false
        default: '2000000'
      max_risk_inr:
        description: 'Max Risk per trade in INR (Default: ₹15)'
        required: false
        default: '15'

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Screener
        run: |
          python coin_screener.py \
            --max-risk-inr ${{ github.event.inputs.max_risk_inr || '15' }} \
            --min-binance-24h-vol-usd ${{ github.event.inputs.min_volume || '2000000' }}
