# render.yaml — Free cloud deployment config for dashboard API
# Deploy at: https://render.com (free tier, no credit card needed)

services:
  - type: web
    name: cryptobot-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      # Set these manually in Render before deploying this security change.
      - key: DASHBOARD_AUTH_USERNAME
        sync: false
      - key: DASHBOARD_AUTH_PASSWORD
        sync: false
      - key: DASHBOARD_PUBLIC_ORIGIN
        sync: false
      # Fine-grained token with Contents: read only. No dashboard write token.
      - key: GH_READ_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: MrZkull/Crypto_AI_bot
      - key: GITHUB_BRANCH
        value: main
      - key: DERIBIT_TESTNET_READONLY_CLIENT_ID
        sync: false
      - key: DERIBIT_TESTNET_READONLY_CLIENT_SECRET
        sync: false
